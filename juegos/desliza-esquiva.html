<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desliza y Esquiva · Mini Arcade</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Arcade">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/companion.css">
<style>
  #game-root{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  #hud{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-size:clamp(8px, 2.6vw, 10px);
    letter-spacing:.5px;
    gap:6px 10px;
  }
  #hud .stat{ color:var(--dim); }
  #hud .val{ color:var(--ink); margin-left:4px; }
  #best-val.pop{ animation: pop-scale .45s ease; }

  #hud2{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-bottom:8px;
  }
  .mini-btn{
    font-family:inherit;
    font-size:clamp(9px, 2.6vw, 10px);
    background:transparent;
    color:var(--dim);
    border:1px solid var(--grid);
    padding:9px 12px;
    min-height:36px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .mini-btn:hover{ color:var(--ink); border-color:var(--dim); }
  .mini-btn:active{ transform:translate(1px,1px); }

  #canvas-wrap{
    position:relative;
    width:100%;
    max-width:520px;
    border:3px solid var(--grid);
    background:var(--panel);
    box-shadow: 0 0 0 4px var(--bg), 6px 6px 0 rgba(0,0,0,.35);
  }
  #canvas-wrap.shake{ animation: shake .28s ease; }
  canvas{
    display:block;
    width:100%;
    aspect-ratio: 3 / 5;
    cursor:pointer;
    touch-action:none;
  }
  #player-slot{
    position:absolute;
    left:0; top:0;
    z-index:5;
    pointer-events:none;
    transition:left .12s ease;
  }

  #flash-overlay{
    position:absolute; inset:0;
    opacity:0;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  #flash-overlay.flash{ animation: flash-fade .35s ease-out; }

  #banner{
    position:absolute;
    top:10px; left:50%;
    transform:translate(-50%,-10px);
    font-size:10px;
    color:var(--ink);
    background:rgba(20,18,31,.85);
    border:1px solid var(--grid);
    padding:6px 10px;
    opacity:0;
    pointer-events:none;
    white-space:nowrap;
  }
  #banner.show{ animation: banner-in 1.1s ease; }

  #overlay{
    position:absolute; inset:0;
    background:rgba(20,18,31,.92);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:20px;
  }
  #overlay h2{ font-size:clamp(12px, 4vw, 14px); margin:0; color:var(--c3); }
  #overlay.lost h2{ color:var(--c1); }
  #overlay p{ font-size:clamp(8px, 2.6vw, 9px); color:var(--dim); line-height:1.9; margin:0; max-width:360px; }
  #overlay button{
    font-family:inherit; font-size:clamp(10px, 3vw, 11px);
    background:var(--c2); color:#14121f;
    border:none; padding:14px 22px; cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.4);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #overlay button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.4); }

  #controls{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:10px;
  }
  #controls button{
    font-family:inherit;
    font-size:18px;
    background:var(--panel);
    color:var(--ink);
    border:2px solid var(--grid);
    width:64px; height:44px;
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.35);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #controls button:hover{ border-color:var(--dim); }
  #controls button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.35); }

  #foot-note{ margin-top:10px; font-size:clamp(7px, 2vw, 8px); color:var(--dim); text-align:center; max-width:480px; line-height:1.8; }

  @keyframes pop-scale{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.6) rotate(-8deg); }
    70%{ transform:scale(.9); }
    100%{ transform:scale(1); }
  }
  @keyframes flash-fade{
    0%{ opacity:.4; }
    100%{ opacity:0; }
  }
  @keyframes banner-in{
    0%{ opacity:0; transform:translate(-50%,-10px); }
    15%{ opacity:1; transform:translate(-50%,0); }
    82%{ opacity:1; transform:translate(-50%,0); }
    100%{ opacity:0; transform:translate(-50%,-10px); }
  }
  @keyframes shake{
    0%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(3px); }
    100%{ transform:translateX(0); }
  }
</style>
</head>
<body>

  <div class="top-nav">
    <a class="back-link" href="../index.html">← MENÚ</a>
    <span class="page-title">DESLIZA Y ESQUIVA</span>
  </div>

  <div id="game-root">
    <div id="hud">
      <div><span class="stat">PUNTOS</span><span class="val" id="score-val">0</span></div>
      <div><span class="stat">MEJOR</span><span class="val" id="best-val">0</span></div>
    </div>

    <div id="hud2">
      <button class="mini-btn" id="mute-btn">SONIDO: ON</button>
      <button class="mini-btn" id="restart-btn">REINICIAR</button>
    </div>

    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
      <div id="player-slot"></div>
      <div id="flash-overlay"></div>
      <div id="banner">¡NUEVO RÉCORD!</div>
      <div id="overlay">
        <h2 id="overlay-title">DESLIZA Y ESQUIVA</h2>
        <p id="overlay-text">Desliza, usa las flechas o los botones para cambiar de carril. Esquiva los obstáculos y recoge las monedas. Si chocas, pierdes.</p>
        <button id="start-btn">EMPEZAR</button>
      </div>
    </div>

    <div id="controls">
      <button id="leftButton">‹</button>
      <button id="rightButton">›</button>
    </div>

    <div id="foot-note">sin guardado de partida &middot; desliza, toca o usa las flechas</div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const playerSlot = document.getElementById('player-slot');
  const scoreEl = document.getElementById('score-val');
  const bestEl = document.getElementById('best-val');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start-btn');
  const muteBtn = document.getElementById('mute-btn');
  const restartBtn = document.getElementById('restart-btn');
  const flashOverlay = document.getElementById('flash-overlay');
  const banner = document.getElementById('banner');
  const canvasWrap = document.getElementById('canvas-wrap');
  const root = document.documentElement;

  function getVar(name){ return getComputedStyle(root).getPropertyValue(name).trim(); }

  const BEST_KEY = 'miniArcade.desliza.best';
  function loadBest(){
    try{ const v = sessionStorage.getItem(BEST_KEY); return v ? (parseInt(v,10)||0) : 0; }
    catch(e){ return 0; }
  }
  function saveBest(v){
    try{ sessionStorage.setItem(BEST_KEY, String(v)); } catch(e){}
  }

  let W = 0, H = 0;
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
  function setupCanvas(){
    const rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setupCanvas();
  let resizeQueued = false;
  window.addEventListener('resize', ()=>{
    if(resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(()=>{
      resizeQueued = false;
      setupCanvas();
      updatePlayerPosition();
    });
  });
  function scaleF(){ return H / 640; }
  function lanesX(){ return [W/6, W/2, (5*W)/6]; }
  function playerY(){ return H * 0.84; }

  let game = null;
  let raf = null;
  let lastTime = null;
  let touchStartX = null;
  let state = 'idle';
  let score = 0;
  let best = loadBest();
  let muted = false;
  let audioCtx = null;

  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
  }
  function beep(freq, dur, type, vol, glideTo){
    if(muted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.06;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, now + dur);
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.start(now);
    osc.stop(now + dur);
  }
  function sfxCoin(){ beep(780, 0.07, 'square', 0.05); }
  function sfxCrash(){ beep(150, 0.24, 'sawtooth', 0.06, 60); }
  function sfxRecord(){ beep(900, 0.07, 'square', 0.05); setTimeout(()=>beep(1200, 0.09, 'square', 0.05), 60); }

  function replay(el, cls){
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }
  function flashColor(hex){
    flashOverlay.style.background = hex;
    replay(flashOverlay, 'flash');
  }

  bestEl.textContent = best;

  window.addEventListener('load', ()=>{
    Companion.mount(playerSlot, { size: 30 });

    startBtn.addEventListener('click', startGame);
    canvas.addEventListener('touchstart', handleTouchStart, {passive:true});
    canvas.addEventListener('touchend', handleTouchEnd);
    document.getElementById('leftButton').addEventListener('click', ()=>moveLane(-1));
    document.getElementById('rightButton').addEventListener('click', ()=>moveLane(1));
    document.addEventListener('keydown', handleKeyDown);
    muteBtn.addEventListener('click', ()=>{
      muted = !muted;
      muteBtn.textContent = 'SONIDO: ' + (muted ? 'OFF' : 'ON');
    });
    restartBtn.addEventListener('click', restartGame);

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('../sw.js').catch(()=>{});
    }

    drawFrame();
  });

  function drawFrame(){
    if(!canvas) return;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = getVar('--panel');
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(77,217,206,0.15)';
    ctx.lineWidth = 1;
    const lanes = lanesX();
    [ (lanes[0]+lanes[1])/2, (lanes[1]+lanes[2])/2 ].forEach(x=>{
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    });

    const g = game;
    if(!g) return;
    const s = scaleF();

    ctx.fillStyle = getVar('--c2');
    g.coins.forEach(c=>{
      ctx.beginPath();
      ctx.arc(lanes[c.lane], c.y, 6*s, 0, Math.PI*2);
      ctx.fill();
    });

    ctx.fillStyle = getVar('--c1');
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    g.obstacles.forEach(o=>{
      const w = 42*s, h = 24*s;
      ctx.fillRect(lanes[o.lane]-w/2, o.y-h/2, w, h);
      ctx.strokeRect(lanes[o.lane]-w/2, o.y-h/2, w, h);
    });
  }

  function startGame(){
    ensureAudio();
    setupCanvas();
    game = {
      lane: 1,
      obstacles: [],
      coins: [],
      elapsed: 0,
      spawnTimer: 0.6,
      coinsCollected: 0,
      running: true
    };
    updatePlayerPosition();
    lastTime = null;
    score = 0;
    scoreEl.textContent = '0';
    state = 'playing';
    overlay.classList.remove('lost');
    overlay.style.display = 'none';
    startBtn.textContent = 'JUGAR';
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function loop(ts){
    const g = game;
    if(!g || !g.running) return;
    if(lastTime === null) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    const s = scaleF();
    g.elapsed += dt;
    const speed = (160 + g.elapsed*7) * s;
    g.spawnTimer -= dt;
    if(g.spawnTimer <= 0){
      const lane = Math.floor(Math.random()*3);
      if(Math.random() < 0.25) g.coins.push({ lane, y:-20*s });
      else g.obstacles.push({ lane, y:-20*s });
      g.spawnTimer = Math.max(0.45, 0.9 - g.elapsed*0.01);
    }

    g.obstacles.forEach(o=>{ o.y += speed*dt; });
    g.coins.forEach(c=>{ c.y += speed*dt; });

    const pY = playerY();
    const hitRadius = 22*s;
    let crashed = false;
    for(const o of g.obstacles){
      if(o.lane === g.lane && Math.abs(o.y - pY) < hitRadius){ crashed = true; break; }
    }
    for(const c of g.coins){
      if(!c.taken && c.lane === g.lane && Math.abs(c.y - pY) < hitRadius*0.9){
        c.taken = true;
        g.coinsCollected += 1;
        sfxCoin();
        if(g.coinsCollected % 5 === 0 && window.Companion) Companion.play('cheer');
      }
    }
    g.coins = g.coins.filter(c=>!c.taken && c.y < H+20);
    g.obstacles = g.obstacles.filter(o=>o.y < H+20);

    score = Math.floor(g.elapsed*10) + g.coinsCollected*15;
    scoreEl.textContent = score;

    drawFrame();

    if(crashed){
      g.running = false;
      finishGame(score);
      return;
    }
    raf = requestAnimationFrame(loop);
  }

  function finishGame(finalScore){
    state = 'over';
    overlay.classList.add('lost');
    overlayTitle.textContent = 'HAS CHOCADO';
    startBtn.textContent = 'REINTENTAR';
    sfxCrash();
    flashColor(getVar('--c1'));
    replay(canvasWrap, 'shake');
    if(window.Companion) Companion.play('sad');

    if(finalScore > best){
      best = finalScore;
      bestEl.textContent = best;
      saveBest(best);
      replay(bestEl, 'pop');
      overlayText.textContent = '¡NUEVO RÉCORD! · PUNTOS: ' + finalScore;
      banner.style.color = getVar('--c3');
      replay(banner, 'show');
      sfxRecord();
    } else {
      overlayText.textContent = 'PUNTOS: ' + finalScore + '   ·   MEJOR: ' + best;
    }
    overlay.style.display = 'flex';
  }

  function moveLane(dir){
    const g = game;
    if(!g || !g.running) return;
    g.lane = Math.min(2, Math.max(0, g.lane + dir));
    updatePlayerPosition();
  }

  function handleTouchStart(e){ touchStartX = e.touches[0].clientX; }
  function handleTouchEnd(e){
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 30) moveLane(dx > 0 ? 1 : -1);
    touchStartX = null;
  }
  function handleKeyDown(e){
    if(state !== 'playing') return;
    if(e.key === 'ArrowLeft') moveLane(-1);
    else if(e.key === 'ArrowRight') moveLane(1);
  }

  function restartGame(){
    cancelAnimationFrame(raf);
    startGame();
  }

  function updatePlayerPosition(){
    if(!game) return;
    const size = 30;
    const lanes = lanesX();
    playerSlot.style.left = (lanes[game.lane] - size/2) + 'px';
    playerSlot.style.top = (playerY() - size/2) + 'px';
  }
})();
</script>

<script src="../assets/companion.js"></script>

</body>
</html>

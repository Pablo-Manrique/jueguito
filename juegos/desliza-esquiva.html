<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salto sin Fin · Mini Arcade</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" href="../assets/favicon-48.png">
    <link rel="apple-touch-icon" href="../assets/icon-180.png">
    <meta name="theme-color" content="#14121f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mini Arcade">
    <link rel="stylesheet" href="../assets/theme.css">
    <link rel="stylesheet" href="../assets/companion.css">

    <style>
        #game-root {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #hud {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: clamp(8px, 2.6vw, 10px);
            letter-spacing: .5px;
            gap: 6px 10px;
        }

        #hud .stat {
            color: var(--dim);
        }

        #hud .val {
            color: var(--ink);
            margin-left: 4px;
        }

        #streak-mult {
            display: inline-block;
            color: var(--c3);
        }

        #streak-mult.pop {
            animation: pop-scale .45s ease;
        }

        #best-val.pop {
            animation: pop-scale .45s ease;
        }

        #hud2 {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 8px;
        }

        .mini-btn {
            font-family: inherit;
            font-size: clamp(9px, 2.6vw, 10px);
            background: transparent;
            color: var(--dim);
            border: 1px solid var(--grid);
            padding: 9px 12px;
            min-height: 36px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .mini-btn:hover {
            color: var(--ink);
            border-color: var(--dim);
        }

        .mini-btn:active {
            transform: translate(1px, 1px);
        }

        #canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 520px;
            border: 3px solid var(--grid);
            background: var(--panel);
            box-shadow: 0 0 0 4px var(--bg), 6px 6px 0 rgba(0, 0, 0, .35);
        }

        #canvas-wrap.shake {
            animation: shake .28s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 700px;
            cursor: pointer;
            touch-action: none;
        }

        @media (max-width: 480px) {
            canvas {
                aspect-ratio: 4 / 3;
            }
        }

        #flash-overlay {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        #flash-overlay.flash {
            animation: flash-fade .35s ease-out;
        }

        #banner {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translate(-50%, -10px);
            font-size: 10px;
            color: var(--ink);
            background: rgba(20, 18, 31, .85);
            border: 1px solid var(--grid);
            padding: 6px 10px;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        #banner.show {
            animation: banner-in 1.1s ease;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(20, 18, 31, .92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            padding: 20px;
        }

        #overlay h2 {
            font-size: clamp(12px, 4vw, 14px);
            margin: 0;
            color: var(--c3);
        }

        #overlay p {
            font-size: clamp(8px, 2.6vw, 9px);
            color: var(--dim);
            line-height: 1.9;
            margin: 0;
            max-width: 360px;
        }

        #overlay button {
            font-family: inherit;
            font-size: clamp(10px, 3vw, 11px);
            background: var(--c2);
            color: #14121f;
            border: none;
            padding: 14px 22px;
            cursor: pointer;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, .4);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #overlay button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 rgba(0, 0, 0, .4);
        }

        #foot-note {
            margin-top: 10px;
            font-size: clamp(7px, 2vw, 8px);
            color: var(--dim);
            text-align: center;
            max-width: 480px;
            line-height: 1.8;
        }

        @keyframes pop-scale {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.6) rotate(-8deg);
            }

            70% {
                transform: scale(.9);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes flash-fade {
            0% {
                opacity: .4;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes banner-in {
            0% {
                opacity: 0;
                transform: translate(-50%, -10px);
            }

            15% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            82% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -10px);
            }
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(5px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(3px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .blip-corner {
            position: absolute;
            right: 8px;
            bottom: 8px;
            z-index: 4;
            pointer-events: none;
        }

        #player-slot {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 5;
            pointer-events: none;
            transition: left .12s ease;
        }
    </style>


<body>

    <div class="top-nav">
        <a class="back-link" href="../index.html">← MENÚ</a>
        <span class="page-title">DESLIZA Y ESQUIVA</span>
    </div>

    <div id="game-root">
        <div id="hud">
            <div><span class="stat">PUNTOS</span><span class="val" id="score-val">0</span></div>
            <div><span class="stat">MEJOR</span><span class="val" id="best-val">0</span></div>
        </div>

        <div id="hud2">
            <button class="mini-btn" id="mute-btn">SONIDO: ON</button>
            <button class="mini-btn" id="restart-btn">REINICIAR</button>
        </div>

        <div id="canvas-wrap">
            <canvas id="gameCanvas" width="300" height="800"></canvas>
            <div id="player-slot"></div>
            <div id="overlay">
                <h2 id="overlay-title">DESLIZA Y ESQUIVA</h2>
                <p id="overlay-text">Esquiva los obstáculos y recoge las monedas.</p>
                <button id="start-btn">EMPEZAR</button>
            </div>
        </div>
        <div id="controls">

            <button id="leftButton">‹</button>

            <button id="rightButton">›</button>

        </div>

        <div id="foot-note">sin guardado de partida &middot; toque/click/espacio</div>
    </div>
</body>

<script>
    let canvas;
    let ctx;

    let game = null;
    let raf = null;
    let lastTime = null;
    let touchStartX = null;

    let state = "idle";
    let score = 0;
    let best = 0;
    let muted = false;
    let playerSlot;

    const scoreEl = document.getElementById("score-val");
    const bestEl = document.getElementById("best-val");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayText = document.getElementById("overlay-text");
    const startBtn = document.getElementById("start-btn");
    const muteBtn = document.getElementById('mute-btn');
    const restartBtn = document.getElementById("restart-btn");


    const W = 300;
    const H = 800;
    const LANES = [W / 6, W / 2, (5 * W) / 6];

    window.onload = async function () {
        canvas = document.getElementById("gameCanvas");
        ctx = canvas.getContext("2d");

        playerSlot = document.getElementById("player-slot");

        Companion.mount(playerSlot, {
            size: 30
        });

        try {
            const res = await window.storage.get("juego_best", false);

            if (res) {
                best = Number(res.value) || 0;
                bestEl.textContent = best;
            }

        } catch (e) { }

        startBtn.addEventListener("click", startGame);
        canvas.addEventListener("touchstart", handleTouchStart);

        canvas.addEventListener("touchend", handleTouchEnd);

        document.getElementById("leftButton")
            .addEventListener("click", () => moveLane(-1));

        document.getElementById("rightButton")
            .addEventListener("click", () => moveLane(1));
        document.addEventListener("keydown", handleKeyDown);
        muteBtn.addEventListener('click', () => {
            muted = !muted;
            muteBtn.textContent = 'SONIDO: ' + (muted ? 'OFF' : 'ON');
        });
        restartBtn.addEventListener("click", restartGame);

        drawFrame();
    }

    function drawFrame() {
        if (!canvas) return;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0A0F14';
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(77,217,206,0.15)';
        ctx.lineWidth = 1;
        [W / 3, (2 * W) / 3].forEach(x => {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.stroke();
        });
        const g = game;
        if (!g) return;
        ctx.fillStyle = '#4DD9CE';
        g.coins.forEach(c => {
            ctx.beginPath();
            ctx.arc(LANES[c.lane], c.y, 6, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.fillStyle = '#E2637A';
        g.obstacles.forEach(o => {
            ctx.fillRect(LANES[o.lane] - 22, o.y - 13, 44, 26);
        });

    }

    function startGame() {
        game = {
            lane: 1,
            obstacles: [],
            coins: [],
            speed: 160,
            elapsed: 0,
            spawnTimer: 0.6,
            coinsCollected: 0,
            running: true,
        };

        updatePlayerPosition();

        lastTime = null;

        score = 0;
        scoreEl.textContent = "0";

        state = "playing";
        overlay.style.display = "none";
        startBtn.textContent = "JUGAR";



        raf = requestAnimationFrame(loop);


    }

    function loop(ts) {
        const g = game;

        if (!g || !g.running) return;

        if (lastTime === null)
            lastTime = ts;

        const dt = Math.min((ts - lastTime) / 1000, 0.05);

        lastTime = ts;

        g.elapsed += dt;
        g.speed = 160 + g.elapsed * 7;
        g.spawnTimer -= dt;

        if (g.spawnTimer <= 0) {

            const lane = Math.floor(Math.random() * 3);

            if (Math.random() < 0.25)
                g.coins.push({ lane, y: -20 });

            else
                g.obstacles.push({ lane, y: -20 });

            g.spawnTimer = Math.max(0.45, 0.9 - g.elapsed * 0.01);
        }

        g.obstacles.forEach(o => { o.y += g.speed * dt; });
        g.coins.forEach(c => { c.y += g.speed * dt; });

        const playerY = H - 70;
        let crashed = false;

        for (const o of g.obstacles) {
            if (o.lane === g.lane && Math.abs(o.y - playerY) < 22) {
                crashed = true;
                break;
            }
        }

        for (const c of g.coins) {
            if (!c.taken && c.lane === g.lane && Math.abs(c.y - playerY) < 20) {
                c.taken = true;
                g.coinsCollected += 1;
            }
        }

        g.coins = g.coins.filter(c => !c.taken && c.y < H + 20);
        g.obstacles = g.obstacles.filter(o => o.y < H + 20);

        const liveScore = Math.floor(g.elapsed * 10) + g.coinsCollected * 15;

        score = liveScore;
        scoreEl.textContent = score;

        drawFrame();

        if (crashed) {
            g.running = false;
            finishGame(liveScore);
            return;
        }

        raf = requestAnimationFrame(loop);

    }

    async function finishGame(finalScore) {

        state = "over";

        overlay.style.display = "flex";

        overlayTitle.textContent = "FIN DE LA PARTIDA";
        startBtn.textContent = "REINTENTAR";

        if (finalScore > best) {

            best = finalScore;

            bestEl.textContent = best;

            overlayText.textContent =
                "¡NUEVO RÉCORD!";

            try {

                await window.storage.set(
                    "juego_best",
                    String(finalScore),
                    false
                );

            } catch (e) { }

        } else {

            overlayText.textContent =
                "Puntuación: " + finalScore;

        }

    }

    function moveLane(dir) {
        const g = game;

        if (!g || !g.running) return;

        g.lane = Math.min(2, Math.max(0, g.lane + dir));

        updatePlayerPosition();
    }

    function handleTouchStart(e) {

        touchStartX = e.touches[0].clientX;

    }

    function handleTouchEnd(e) {

        if (touchStartX === null)
            return;

        const dx = e.changedTouches[0].clientX - touchStartX;

        if (Math.abs(dx) > 30)
            moveLane(dx > 0 ? 1 : -1);

        touchStartX = null;

    }

    function handleKeyDown(e) {

        if (state !== "playing")
            return;

        if (e.key === "ArrowLeft") {

            moveLane(-1);

        } else if (e.key === "ArrowRight") {

            moveLane(1);

        }

    }

    function restartGame() {

        if (raf) {
            cancelAnimationFrame(raf);
        }

        startGame();

    }

    function updatePlayerPosition() {

        if (!game) return;

        const size = 30;

        const scale = canvas.clientWidth / W;

        playerSlot.style.left =
            (LANES[game.lane] * scale - size / 2) + "px";
        const scaleY = canvas.clientHeight / H;

        playerSlot.style.top =
            ((H - 70) * scaleY - size / 2) + "px";

    }
</script>
<script src="../assets/companion.js"></script>

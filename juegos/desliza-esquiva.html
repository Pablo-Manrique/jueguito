<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desliza y Esquiva · Mini Arcade</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Arcade">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/companion.css">
<style>
  #game-root{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  #hud{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-size:clamp(8px, 2.6vw, 10px);
    letter-spacing:.5px;
    gap:6px 10px;
  }
  #hud .stat{ color:var(--dim); }
  #hud .val{ color:var(--ink); margin-left:4px; }
  #best-val.pop{ animation: pop-scale .45s ease; }

  #hud2{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-bottom:8px;
  }
  .mini-btn{
    font-family:inherit;
    font-size:clamp(9px, 2.6vw, 10px);
    background:transparent;
    color:var(--dim);
    border:1px solid var(--grid);
    padding:9px 12px;
    min-height:36px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .mini-btn:hover{ color:var(--ink); border-color:var(--dim); }
  .mini-btn:active{ transform:translate(1px,1px); }

  #canvas-wrap{
    position:relative;
    width:100%;
    max-width:520px;
    border:3px solid var(--grid);
    background:var(--panel);
    box-shadow: 0 0 0 4px var(--bg), 6px 6px 0 rgba(0,0,0,.35);
  }
  #canvas-wrap.shake{ animation: shake .28s ease; }
  canvas{
    display:block;
    width:100%;
    aspect-ratio: 3 / 5;
    cursor:pointer;
    touch-action:none;
  }
  #player-slot{
    position:absolute;
    left:0; top:0;
    z-index:5;
    pointer-events:none;
    transition:left .12s ease;
  }

  #flash-overlay{
    position:absolute; inset:0;
    opacity:0;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  #flash-overlay.flash{ animation: flash-fade .35s ease-out; }

  #banner{
    position:absolute;
    top:10px; left:50%;
    transform:translate(-50%,-10px);
    font-size:10px;
    color:var(--ink);
    background:rgba(20,18,31,.85);
    border:1px solid var(--grid);
    padding:6px 10px;
    opacity:0;
    pointer-events:none;
    white-space:nowrap;
  }
  #banner.show{ animation: banner-in 1.1s ease; }

  #overlay{
    position:absolute; inset:0;
    background:rgba(20,18,31,.92);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:20px;
  }
  #overlay h2{ font-size:clamp(12px, 4vw, 14px); margin:0; color:var(--c3); }
  #overlay.lost h2{ color:var(--c1); }
  #overlay p{ font-size:clamp(8px, 2.6vw, 9px); color:var(--dim); line-height:1.9; margin:0; max-width:360px; }
  #overlay button{
    font-family:inherit; font-size:clamp(10px, 3vw, 11px);
    background:var(--c2); color:#14121f;
    border:none; padding:14px 22px; cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.4);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #overlay button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.4); }

  #controls{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:10px;
  }
  #controls button{
    font-family:inherit;
    font-size:18px;
    background:var(--panel);
    color:var(--ink);
    border:2px solid var(--grid);
    width:64px; height:44px;
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.35);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #controls button:hover{ border-color:var(--dim); }
  #controls button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.35); }

  #foot-note{ margin-top:10px; font-size:clamp(7px, 2vw, 8px); color:var(--dim); text-align:center; max-width:480px; line-height:1.8; }

  @keyframes pop-scale{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.6) rotate(-8deg); }
    70%{ transform:scale(.9); }
    100%{ transform:scale(1); }
  }
  @keyframes flash-fade{
    0%{ opacity:.4; }
    100%{ opacity:0; }
  }
  @keyframes banner-in{
    0%{ opacity:0; transform:translate(-50%,-10px); }
    15%{ opacity:1; transform:translate(-50%,0); }
    82%{ opacity:1; transform:translate(-50%,0); }
    100%{ opacity:0; transform:translate(-50%,-10px); }
  }
  @keyframes shake{
    0%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(3px); }
    100%{ transform:translateX(0); }
  }
</style>
</head>
<body>

  <div class="top-nav">
    <a class="back-link" href="../index.html">← MENÚ</a>
    <span class="page-title">DESLIZA Y ESQUIVA</span>
  </div>

  <div id="game-root">
    <div id="hud">
      <div><span class="stat">PUNTOS</span><span class="val" id="score-val">0</span></div>
      <div><span class="stat">MEJOR</span><span class="val" id="best-val">0</span></div>
    </div>

    <div id="hud2">
      <button class="mini-btn" id="mute-btn">SONIDO: ON</button>
      <button class="mini-btn" id="restart-btn">REINICIAR</button>
    </div>

    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
      <div id="player-slot"></div>
      <div id="flash-overlay"></div>
      <div id="banner">¡NUEVO RÉCORD!</div>
      <div id="overlay">
        <h2 id="overlay-title">DESLIZA Y ESQUIVA</h2>
        <p id="overlay-text">Desliza, usa las flechas o los botones para cambiar de carril. Esquiva los obstáculos y recoge las monedas. Si chocas, pierdes.</p>
        <button id="start-btn">EMPEZAR</button>
      </div>
    </div>

    <div id="controls">
      <button id="leftButton">‹</button>
      <button id="rightButton">›</button>
    </div>

    <div id="foot-note">sin guardado de partida &middot; desliza, toca o usa las flechas</div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const playerSlot = document.getElementById('player-slot');
  const scoreEl = document.getElementById('score-val');
  const bestEl = document.getElementById('best-val');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start-btn');
  const muteBtn = document.getElementById('mute-btn');
  const restartBtn = document.getElementById('restart-btn');
  const flashOverlay = document.getElementById('flash-overlay');
  const banner = document.getElementById('banner');
  const canvasWrap = document.getElementById('canvas-wrap');
  const root = document.documentElement;

  function getVar(name){
    return getComputedStyle(root).getPropertyValue(name).trim();
  }

  const BEST_KEY = 'miniArcade.desliza.best';

  function loadBest(){
    try{
      const v = sessionStorage.getItem(BEST_KEY);
      return v ? (parseInt(v,10) || 0) : 0;
    }catch(e){
      return 0;
    }
  }

  function saveBest(v){
    try{
      sessionStorage.setItem(BEST_KEY, String(v));
    }catch(e){}
  }

  let W = 0;
  let H = 0;

  const dpr = Math.max(
    1,
    Math.min(window.devicePixelRatio || 1, 3)
  );

  function setupCanvas(){
    const rect = canvas.getBoundingClientRect();

    W = rect.width;
    H = rect.height;

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  setupCanvas();

  let resizeQueued = false;

  window.addEventListener('resize', ()=>{
    if(resizeQueued) return;

    resizeQueued = true;

    requestAnimationFrame(()=>{
      resizeQueued = false;
      setupCanvas();
      updatePlayerPosition();
    });
  });

  function scaleF(){
    return H / 640;
  }

  function lanesX(){
    return [
      W / 6,
      W / 2,
      (5 * W) / 6
    ];
  }

  function playerY(){
    return H * 0.84;
  }

  let game = null;
  let raf = null;
  let lastTime = null;

  let touchStartX = null;

  let state = 'idle';

  let score = 0;
  let best = loadBest();

  let muted = false;
  let audioCtx = null;

  function ensureAudio(){
    if(!audioCtx){
      try{
        audioCtx = new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
      }catch(e){
        audioCtx = null;
      }
    }

    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().catch(()=>{});
    }
  }

  function beep(freq, dur, type, vol, glideTo){
    if(muted || !audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type || 'square';
    osc.frequency.value = freq;

    gain.gain.value = vol || 0.06;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if(glideTo){
      osc.frequency.exponentialRampToValueAtTime(
        glideTo,
        now + dur
      );
    }

    gain.gain.setValueAtTime(
      gain.gain.value,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + dur
    );

    osc.start(now);
    osc.stop(now + dur);
  }

  function sfxCoin(){
    beep(780, 0.07, 'square', 0.05);
  }

  function sfxOvertake(){
    beep(620, 0.06, 'square', 0.045);
    setTimeout(()=>{
      beep(880, 0.08, 'square', 0.045);
    }, 45);
  }

  function sfxNearMiss(){
    beep(520, 0.07, 'triangle', 0.045);
    setTimeout(()=>{
      beep(980, 0.09, 'square', 0.045);
    }, 50);
  }

  function sfxCrash(){
    beep(150, 0.24, 'sawtooth', 0.06, 60);
  }

  function sfxRecord(){
    beep(900, 0.07, 'square', 0.05);

    setTimeout(()=>{
      beep(1200, 0.09, 'square', 0.05);
    }, 60);
  }

  function sfxSlipstream(){
    beep(360, 0.06, 'triangle', 0.035);
    setTimeout(()=>{
      beep(480, 0.06, 'triangle', 0.035);
    }, 60);
  }

  function replay(el, cls){
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function flashColor(hex){
    flashOverlay.style.background = hex;
    replay(flashOverlay, 'flash');
  }

  bestEl.textContent = best;

  window.addEventListener('load', ()=>{
    Companion.mount(playerSlot, {
      size: 30
    });

    startBtn.addEventListener('click', startGame);

    canvas.addEventListener(
      'touchstart',
      handleTouchStart,
      {passive:true}
    );

    canvas.addEventListener(
      'touchend',
      handleTouchEnd
    );

    document
      .getElementById('leftButton')
      .addEventListener('click', ()=>{
        moveLane(-1);
      });

    document
      .getElementById('rightButton')
      .addEventListener('click', ()=>{
        moveLane(1);
      });

    document.addEventListener(
      'keydown',
      handleKeyDown
    );

    muteBtn.addEventListener('click', ()=>{
      muted = !muted;

      muteBtn.textContent =
        'SONIDO: ' +
        (muted ? 'OFF' : 'ON');
    });

    restartBtn.addEventListener(
      'click',
      restartGame
    );

    if('serviceWorker' in navigator){
      navigator.serviceWorker
        .register('../sw.js')
        .catch(()=>{});
    }

    drawFrame();
  });

  function drawRoad(){
    const lanes = lanesX();

    /*
      Carretera
    */

    ctx.fillStyle = getVar('--panel');
    ctx.fillRect(0, 0, W, H);

    /*
      Bordes de carretera
    */

    ctx.strokeStyle = 'rgba(77,217,206,0.22)';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(3, 0);
    ctx.lineTo(3, H);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W - 3, 0);
    ctx.lineTo(W - 3, H);
    ctx.stroke();

    /*
      Separadores de carril.
      Se mueven con la velocidad para dar
      sensación de desplazamiento.
    */

    ctx.strokeStyle = 'rgba(77,217,206,0.15)';
    ctx.lineWidth = 1;

    const separators = [
      (lanes[0] + lanes[1]) / 2,
      (lanes[1] + lanes[2]) / 2
    ];

    separators.forEach(x=>{
      const dash = 34 * scaleF();
      const gap = 28 * scaleF();

      const offset =
        game
          ? (game.roadOffset % (dash + gap))
          : 0;

      for(
        let y = -dash + offset;
        y < H + dash;
        y += dash + gap
      ){
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + dash);
        ctx.stroke();
      }
    });
  }

  function drawCar(car){
    const s = scaleF();
    const lanes = lanesX();

    const x = lanes[car.lane];
    const y = car.y;

    let width = 34 * s;
    let height = 48 * s;

    if(car.type === 'truck'){
      width = 46 * s;
      height = 68 * s;
    }

    if(car.type === 'fast'){
      width = 31 * s;
      height = 45 * s;
    }

    if(car.type === 'slow'){
      width = 38 * s;
      height = 50 * s;
    }

    let color = getVar('--c1');

    if(car.type === 'fast'){
      color = getVar('--c3');
    }

    if(car.type === 'slow'){
      color = '#d7a83b';
    }

    if(car.type === 'truck'){
      color = '#b86bff';
    }

    /*
      Sombra
    */

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(
      x - width / 2 + 3 * s,
      y - height / 2 + 4 * s,
      width,
      height
    );

    /*
      Carro
    */

    ctx.fillStyle = color;

    ctx.fillRect(
      x - width / 2,
      y - height / 2,
      width,
      height
    );

    /*
      Parabrisas
    */

    ctx.fillStyle = 'rgba(20,18,31,0.72)';

    ctx.fillRect(
      x - width * 0.31,
      y - height * 0.19,
      width * 0.62,
      height * 0.24
    );

    /*
      Luces / detalles
    */

    ctx.fillStyle = 'rgba(255,255,255,0.75)';

    ctx.fillRect(
      x - width * 0.32,
      y - height * 0.42,
      width * 0.16,
      height * 0.08
    );

    ctx.fillRect(
      x + width * 0.16,
      y - height * 0.42,
      width * 0.16,
      height * 0.08
    );

    ctx.fillStyle = 'rgba(0,0,0,0.28)';

    ctx.fillRect(
      x - width * 0.32,
      y + height * 0.34,
      width * 0.64,
      height * 0.08
    );
  }

  function drawCoin(c){
    const s = scaleF();
    const lanes = lanesX();

    const x = lanes[c.lane];

    ctx.fillStyle = getVar('--c2');

    ctx.beginPath();
    ctx.arc(
      x,
      c.y,
      6 * s,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = 'rgba(20,18,31,0.55)';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(
      x,
      c.y,
      3 * s,
      0,
      Math.PI * 2
    );

    ctx.stroke();
  }

  function drawPlayerCar(){
    if(!game) return;

    const s = scaleF();
    const lanes = lanesX();

    const x = lanes[game.lane];
    const y = playerY();

    /*
      BLIP continúa siendo el personaje.
      Dibujamos debajo un pequeño coche
      para darle identidad de conducción.
    */

    const width = 36 * s;
    const height = 50 * s;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';

    ctx.fillRect(
      x - width / 2 + 3 * s,
      y - height / 2 + 4 * s,
      width,
      height
    );

    ctx.fillStyle = getVar('--c3');

    ctx.fillRect(
      x - width / 2,
      y - height / 2,
      width,
      height
    );

    ctx.fillStyle = 'rgba(20,18,31,0.72)';

    ctx.fillRect(
      x - width * 0.31,
      y - height * 0.18,
      width * 0.62,
      height * 0.25
    );

    /*
      Evitamos tapar demasiado a BLIP.
      El hueco central deja visible al personaje.
    */

    ctx.fillStyle = getVar('--panel');

    ctx.fillRect(
      x - width * 0.24,
      y - height * 0.04,
      width * 0.48,
      height * 0.24
    );
  }

  function drawGameHud(){
    if(!game) return;

    const s = scaleF();

    /*
      Vidas
    */

    ctx.fillStyle = getVar('--ink');
    ctx.font =
      `${Math.max(9, 11*s)}px monospace`;

    ctx.textAlign = 'left';

    ctx.fillText(
      'VIDAS ' +
      '♥'.repeat(game.lives) +
      '♡'.repeat(3 - game.lives),
      10,
      20
    );

    /*
      Rebufo
    */

    const barW = Math.min(120, W * 0.34);
    const barH = 7;
    const barX = W - barW - 10;
    const barY = 12;

    ctx.fillStyle = 'rgba(20,18,31,0.8)';

    ctx.fillRect(
      barX,
      barY,
      barW,
      barH
    );

    ctx.strokeStyle =
      'rgba(77,217,206,0.35)';

    ctx.strokeRect(
      barX,
      barY,
      barW,
      barH
    );

    ctx.fillStyle = getVar('--c3');

    ctx.fillRect(
      barX + 1,
      barY + 1,
      (barW - 2) * game.slipstream,
      barH - 2
    );

    ctx.fillStyle = getVar('--dim');

    ctx.font =
      `${Math.max(7, 8*s)}px monospace`;

    ctx.textAlign = 'right';

    ctx.fillText(
      'REBUFO',
      W - 10,
      barY + barH + 10
    );

    /*
      Combo
    */

    if(game.combo > 1){
      ctx.fillStyle = getVar('--c2');

      ctx.font =
        `${Math.max(8, 10*s)}px monospace`;

      ctx.fillText(
        'COMBO x' + game.combo,
        W - 10,
        H - 12
      );
    }
  }

  function drawFrame(){
    if(!canvas) return;

    ctx.clearRect(0, 0, W, H);

    drawRoad();

    const g = game;

    if(!g) return;

    g.coins.forEach(drawCoin);

    g.obstacles.forEach(drawCar);

    drawPlayerCar();

    drawGameHud();
  }

  function randomCarType(){
    const r = Math.random();

    if(r < 0.12) return 'truck';
    if(r < 0.32) return 'slow';
    if(r < 0.50) return 'fast';

    return 'normal';
  }

  function carSpeedMultiplier(type){
    if(type === 'fast') return 1.22;
    if(type === 'slow') return 0.74;
    if(type === 'truck') return 0.68;

    return 1;
  }

  function spawnTraffic(){
    const g = game;

    const lane = Math.floor(Math.random() * 3);
    const type = randomCarType();

    /*
      Evitamos crear demasiados coches
      juntos en el mismo carril.
    */

    const blocked = g.obstacles.some(o=>
      o.lane === lane &&
      o.y < 130 * scaleF()
    );

    if(blocked) return;

    g.obstacles.push({
      lane,
      y: -70 * scaleF(),
      type,
      speedMul: carSpeedMultiplier(type),
      passed: false,
      nearMissChecked: false,
      slipstreamTime: 0
    });
  }

  function spawnCoin(){
    const g = game;

    const lane =
      Math.floor(Math.random() * 3);

    g.coins.push({
      lane,
      y: -20 * scaleF(),
      taken: false
    });
  }

  function startGame(){
    ensureAudio();

    setupCanvas();

    game = {
      lane: 1,

      obstacles: [],
      coins: [],

      elapsed: 0,

      spawnTimer: 0.55,
      coinTimer: 1.1,

      coinsCollected: 0,

      lives: 3,

      invulnerable: 0,

      overtakes: 0,
      nearMisses: 0,

      combo: 0,
      comboTimer: 0,

      slipstream: 0,
      slipstreamTarget: null,

      roadOffset: 0,

      bannerTimer: 0,

      running: true
    };

    updatePlayerPosition();

    lastTime = null;

    score = 0;

    scoreEl.textContent = '0';

    state = 'playing';

    overlay.classList.remove('lost');

    overlay.style.display = 'none';

    startBtn.textContent = 'JUGAR';

    cancelAnimationFrame(raf);

    if(window.Companion){
      Companion.play('wave');
    }

    raf = requestAnimationFrame(loop);
  }

  function getNearestCarAhead(){
    if(!game) return null;

    const g = game;
    const pY = playerY();

    let bestCar = null;
    let bestDistance = Infinity;

    for(const car of g.obstacles){

      if(car.lane !== g.lane) continue;

      /*
        Solo cuenta como rebufo si está
        realmente delante del jugador.
      */

      const distance = pY - car.y;

      if(
        distance > 25 * scaleF() &&
        distance < 145 * scaleF() &&
        distance < bestDistance
      ){
        bestDistance = distance;
        bestCar = car;
      }
    }

    return bestCar;
  }

  function updateSlipstream(dt){
    const g = game;

    const target = getNearestCarAhead();

    g.slipstreamTarget = target;

    if(target){

      /*
        El rebufo aumenta cuanto más
        cerca estamos, pero no permite
        quedarse pegado eternamente.
      */

      const distance =
        playerY() - target.y;

      const s = scaleF();

      const proximity =
        1 - Math.abs(distance - 75*s) / (75*s);

      const gain =
        Math.max(0.2, Math.min(1, proximity));

      g.slipstream += dt * 0.28 * gain;

      target.slipstreamTime += dt;

      if(
        target.slipstreamTime > 0.85 &&
        !target.slipstreamRewarded
      ){
        target.slipstreamRewarded = true;

        showBanner('¡REBUFO! +20');

        score += 20;

        sfxSlipstream();

        if(window.Companion){
          Companion.play('think');
        }
      }

    }else{
      g.slipstream -= dt * 0.55;
    }

    g.slipstream =
      Math.max(
        0,
        Math.min(1, g.slipstream)
      );
  }

  function registerOvertake(car){
    const g = game;

    if(car.passed) return;

    car.passed = true;

    /*
      Solo consideramos adelantamiento
      cuando el vehículo ya ha pasado
      por detrás del jugador.
    */

    g.overtakes++;

    g.comboTimer = 2.2;

    g.combo++;

    const multiplier =
      Math.min(4, 1 + Math.floor(g.combo / 3));

    const base = 50;

    const bonus =
      Math.round(base * multiplier);

    score += bonus;

    sfxOvertake();

    showBanner(
      '¡ADELANTAMIENTO! +' + bonus
    );

    if(window.Companion){
      Companion.play('cheer');
    }

    /*
      Casi toque:
      si el coche estaba muy cerca
      lateralmente al cruzar la posición
      del jugador.
    */

    if(
      car.lane === g.lane &&
      !car.nearMissChecked
    ){
      car.nearMissChecked = true;
    }
  }

  function checkNearMiss(car){
    const g = game;

    if(car.nearMissChecked) return;

    if(car.y < playerY() - 10 * scaleF()) return;

    if(car.y > playerY() + 20 * scaleF()) return;

    /*
      Para que un cambio de carril
      pueda producir un casi toque,
      miramos si el coche está en un
      carril adyacente.
    */

    const laneDistance =
      Math.abs(car.lane - g.lane);

    if(laneDistance !== 1) return;

    car.nearMissChecked = true;

    g.nearMisses++;

    const bonus = 100;

    score += bonus;

    g.combo++;

    g.comboTimer = 2.2;

    showBanner('¡CASI TOCAS! +100');

    sfxNearMiss();

    flashColor(getVar('--c2'));

    if(window.Companion){
      Companion.play('surprise');
    }
  }

  function updateTraffic(dt, speed){
    const g = game;
    const s = scaleF();
    const pY = playerY();

    for(const car of g.obstacles){

      car.y +=
        speed *
        car.speedMul *
        dt;

      /*
        Coche que acaba de pasar.
      */

      if(
        !car.passed &&
        car.y > pY + 35*s
      ){
        registerOvertake(car);
      }

      checkNearMiss(car);
    }

    /*
      Colisiones.
    */

    if(g.invulnerable <= 0){

      for(const car of g.obstacles){

        const carWidth =
          car.type === 'truck'
            ? 46*s
            : 38*s;

        const carHeight =
          car.type === 'truck'
            ? 68*s
            : 52*s;

        if(
          car.lane === g.lane &&
          Math.abs(car.y - pY) <
            (carHeight / 2 + 18*s)
        ){

          crash();

          /*
            El coche desaparece para que
            no golpee varias veces.
          */

          car.y = H + 200;

          break;
        }
      }
    }

    /*
      Limpieza.
    */

    g.obstacles =
      g.obstacles.filter(
        car => car.y < H + 100
      );
  }

  function updateCoins(dt, speed){
    const g = game;
    const s = scaleF();
    const pY = playerY();

    g.coins.forEach(c=>{
      c.y += speed * dt;

      if(
        !c.taken &&
        c.lane === g.lane &&
        Math.abs(c.y - pY) <
          25*s
      ){
        c.taken = true;

        g.coinsCollected++;

        score += 25;

        sfxCoin();

        if(
          g.coinsCollected % 5 === 0 &&
          window.Companion
        ){
          Companion.play('cheer');
        }
      }
    });

    g.coins =
      g.coins.filter(
        c => !c.taken && c.y < H + 30
      );
  }

  function crash(){
    const g = game;

    if(g.invulnerable > 0) return;

    g.lives--;

    g.invulnerable = 1.25;

    g.combo = 0;
    g.comboTimer = 0;

    g.slipstream = 0;

    sfxCrash();

    flashColor(getVar('--c1'));

    replay(canvasWrap, 'shake');

    if(window.Companion){
      Companion.play(
        g.lives > 0 ? 'surprise' : 'sad'
      );
    }

    if(g.lives > 0){

      showBanner(
        '¡CHOQUE! · ' +
        g.lives +
        ' VIDA' +
        (g.lives === 1 ? '' : 'S')
      );

    }else{
      g.running = false;
      finishGame(score);
    }
  }

  function updateCombo(dt){
    const g = game;

    if(g.combo <= 0) return;

    g.comboTimer -= dt;

    if(g.comboTimer <= 0){
      g.combo = 0;
      g.comboTimer = 0;
    }
  }

  function loop(ts){
    const g = game;

    if(!g || !g.running) return;

    if(lastTime === null){
      lastTime = ts;
    }

    const dt =
      Math.min(
        (ts - lastTime) / 1000,
        0.05
      );

    lastTime = ts;

    const s = scaleF();

    g.elapsed += dt;

    /*
      Velocidad progresiva.
      Más rápida que antes, pero limitada
      para que el juego siga siendo justo.
    */

    const speed =
      Math.min(
        360,
        155 + g.elapsed * 7.2
      ) * s;

    g.roadOffset += speed * dt;

    /*
      Invulnerabilidad tras choque.
    */

    if(g.invulnerable > 0){
      g.invulnerable -= dt;
    }

    /*
      Spawn tráfico.
    */

    g.spawnTimer -= dt;

    if(g.spawnTimer <= 0){

      spawnTraffic();

      /*
        Al principio hay bastante espacio.
        Después aparecen coches más rápido.
      */

      g.spawnTimer =
        Math.max(
          0.38,
          0.86 - g.elapsed * 0.008
        );
    }

    /*
      Spawn monedas.
    */

    g.coinTimer -= dt;

    if(g.coinTimer <= 0){

      if(Math.random() < 0.72){
        spawnCoin();
      }

      g.coinTimer =
        1.05 +
        Math.random() * 0.65;
    }

    updateTraffic(dt, speed);

    updateCoins(dt, speed);

    updateSlipstream(dt);

    updateCombo(dt);

    /*
      Puntuación base por distancia.
    */

    const distanceScore =
      Math.floor(g.elapsed * 10);

    const coinScore =
      g.coinsCollected * 25;

    /*
      Los adelantamientos ya han sumado
      directamente sus bonus a score.
      Por ello conservamos score como
      acumulador y aseguramos siempre
      el mínimo de distancia + monedas.
    */

    const actionScore =
      score -
      (score >= 0 ? 0 : score);

    const minimumScore =
      distanceScore + coinScore;

    /*
      Si todavía no hay suficientes puntos
      de acciones, usamos el mínimo.
    */

    if(score < minimumScore){
      score = minimumScore;
    }

    scoreEl.textContent = score;

    drawFrame();

    raf = requestAnimationFrame(loop);
  }

  function finishGame(finalScore){
    state = 'over';

    overlay.classList.add('lost');

    overlayTitle.textContent =
      'FIN DE LA CARRERA';

    startBtn.textContent =
      'REINTENTAR';

    if(window.Companion){
      Companion.play('sad');
    }

    if(finalScore > best){

      best = finalScore;

      bestEl.textContent = best;

      saveBest(best);

      replay(bestEl, 'pop');

      overlayText.textContent =
        '¡NUEVO RÉCORD! · ' +
        finalScore +
        ' PUNTOS · ' +
        game.overtakes +
        ' ADELANTAMIENTOS';

      banner.style.color =
        getVar('--c3');

      replay(
        banner,
        'show'
      );

      sfxRecord();

    }else{

      overlayText.textContent =
        'PUNTOS: ' +
        finalScore +
        ' · ' +
        game.overtakes +
        ' ADELANTAMIENTOS · ' +
        'MEJOR: ' +
        best;
    }

    overlay.style.display =
      'flex';
  }

  function showBanner(text){
    banner.textContent = text;

    banner.style.color =
      getVar('--ink');

    replay(
      banner,
      'show'
    );
  }

  function moveLane(dir){
    const g = game;

    if(!g || !g.running) return;

    const oldLane = g.lane;

    g.lane =
      Math.min(
        2,
        Math.max(
          0,
          g.lane + dir
        )
      );

    if(oldLane !== g.lane){

      /*
        Cambiar de carril cancela
        ligeramente el rebufo.
      */

      g.slipstream *= 0.35;

      updatePlayerPosition();
    }
  }

  function handleTouchStart(e){
    if(!e.touches.length) return;

    touchStartX =
      e.touches[0].clientX;
  }

  function handleTouchEnd(e){
    if(touchStartX === null) return;

    const dx =
      e.changedTouches[0].clientX -
      touchStartX;

    if(Math.abs(dx) > 30){
      moveLane(
        dx > 0 ? 1 : -1
      );
    }

    touchStartX = null;
  }

  function handleKeyDown(e){
    if(state !== 'playing') return;

    if(e.key === 'ArrowLeft'){
      moveLane(-1);
    }

    else if(e.key === 'ArrowRight'){
      moveLane(1);
    }
  }

  function restartGame(){
    cancelAnimationFrame(raf);
    startGame();
  }

  function updatePlayerPosition(){
    if(!game) return;

    const size = 30;
    const lanes = lanesX();

    playerSlot.style.left =
      (lanes[game.lane] - size / 2) +
      'px';

    playerSlot.style.top =
      (playerY() - size / 2) +
      'px';
  }

})();
</script>

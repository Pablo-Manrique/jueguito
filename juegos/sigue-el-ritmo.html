<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sigue el Ritmo · Mini Arcade</title>

<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">

<link rel="stylesheet" href="../assets/companion.css">

<style>
:root{
  --bg:#08090d;
  --panel:#11131a;
  --text:#f4f5f7;
  --muted:#858995;

  --c1:#ff5f56;
  --c2:#ffd166;
  --c3:#66e3ff;
  --c4:#a78bfa;

  --good:#7dff9b;
  --bad:#ff6b7a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

button{
  font:inherit;
}

#app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  padding:18px 14px 28px;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.back{
  text-decoration:none;
  color:var(--muted);
  font-size:14px;
  padding:8px 0;
}

.back:hover{
  color:var(--text);
}

.title-wrap{
  flex:1;
  text-align:center;
}

h1{
  margin:0;
  font-size:21px;
  letter-spacing:.08em;
  font-weight:800;
}

.subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.best{
  min-width:65px;
  text-align:right;
  color:var(--muted);
  font-size:11px;
  line-height:1.25;
}

.best strong{
  display:block;
  color:var(--text);
  font-size:17px;
}

/* =========================================================
   INFO
========================================================= */

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  max-width:390px;
  margin:0 auto 10px;
  color:var(--muted);
  font-size:12px;
}

.info strong{
  color:var(--text);
}

#score{
  font-size:15px;
}

#lives{
  display:flex;
  gap:5px;
  align-items:center;
}

.life{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--c3);
  box-shadow:0 0 7px rgba(102,227,255,.25);
  transition:
    opacity .15s ease,
    transform .15s ease,
    background .15s ease;
}

.life.lost{
  opacity:.18;
  transform:scale(.75);
  background:rgba(255,255,255,.25);
  box-shadow:none;
}

#combo{
  position:absolute;
  left:50%;
  bottom:7%;
  transform:translateX(-50%);
  z-index:8;

  min-width:100px;
  text-align:center;

  font-size:18px;
  font-weight:800;
  letter-spacing:.05em;

  text-shadow:0 0 12px rgba(255,255,255,.2);

  pointer-events:none;
}

#combo.hot{
  animation:comboPop .18s ease-out;
}

@keyframes comboPop{
  0%{
    transform:translateX(-50%) scale(.8);
    opacity:.4;
  }

  100%{
    transform:translateX(-50%) scale(1);
    opacity:1;
  }
}

/* =========================================================
   GAME BOARD
========================================================= */

#play{
  position:relative;

  width:100%;
  max-width:390px;

  aspect-ratio:.68;

  margin:0 auto;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;

  background:
    radial-gradient(
      circle at 50% 100%,
      rgba(255,255,255,.055),
      transparent 45%
    ),
    linear-gradient(
      180deg,
      rgba(255,255,255,.018),
      rgba(255,255,255,.008)
    );

  box-shadow:
    0 18px 60px rgba(0,0,0,.35),
    inset 0 0 30px rgba(255,255,255,.015);

  touch-action:none;
  user-select:none;
}

/* =========================================================
   LANES
========================================================= */

#lanes{
  position:absolute;
  inset:0;

  display:grid;
  grid-template-columns:repeat(3,1fr);
}

.lane{
  position:relative;

  border-right:1px solid rgba(255,255,255,.075);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.008),
      rgba(255,255,255,.018)
    );

  transition:
    background .08s ease,
    box-shadow .08s ease;
}

.lane:last-child{
  border-right:none;
}

.lane::after{
  content:"";

  position:absolute;

  left:50%;
  bottom:0;

  width:1px;
  height:100%;

  transform:translateX(-50%);

  background:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(255,255,255,.02) 55%,
    rgba(255,255,255,.075) 100%
  );

  pointer-events:none;
}

.lane.ready{
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.012),
      rgba(255,255,255,.07)
    );

  box-shadow:
    inset 0 -70px 60px rgba(255,255,255,.055);
}

.lane-key{
  position:absolute;

  left:50%;
  bottom:10px;

  transform:translateX(-50%);

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;

  color:rgba(255,255,255,.35);

  font-size:13px;
  font-weight:800;

  background:rgba(255,255,255,.025);

  transition:
    color .08s ease,
    border-color .08s ease,
    background .08s ease,
    transform .08s ease;
}

.lane.ready .lane-key{
  color:rgba(255,255,255,.85);

  border-color:rgba(255,255,255,.3);

  background:rgba(255,255,255,.09);

  transform:translateX(-50%) scale(1.05);
}

/* =========================================================
   HIT ZONE
========================================================= */

#hit-zone{
  position:absolute;

  left:0;
  right:0;

  bottom:25%;

  height:82px;

  border-top:2px solid var(--c3);
  border-bottom:1px solid rgba(102,227,255,.3);

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.025),
      rgba(255,255,255,.07),
      rgba(255,255,255,.025)
    );

  box-shadow:
    0 -1px 12px rgba(102,227,255,.06),
    0 1px 10px rgba(102,227,255,.03);

  pointer-events:none;

  z-index:3;

  transition:
    background .08s ease,
    box-shadow .08s ease,
    border-color .08s ease;
}

#hit-zone.ready{
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.045),
      rgba(255,255,255,.13),
      rgba(255,255,255,.045)
    );

  border-top-color:rgba(102,227,255,.95);

  box-shadow:
    0 -2px 20px rgba(102,227,255,.14),
    0 2px 15px rgba(102,227,255,.07);
}

/* =========================================================
   NOTES
========================================================= */

.note{
  position:absolute;

  top:0;

  width:33.3333%;
  height:54px;

  border-radius:12px;

  transform:translateY(-90px);

  z-index:5;

  box-shadow:
    0 6px 20px rgba(0,0,0,.25);

  transition:
    filter .06s ease,
    opacity .08s ease;
}

.note::after{
  content:"";

  position:absolute;

  inset:5px;

  border:1px solid rgba(255,255,255,.28);

  border-radius:8px;

  pointer-events:none;
}

.note.a{
  background:
    linear-gradient(
      180deg,
      rgba(255,95,86,.95),
      rgba(255,95,86,.65)
    );
}

.note.b{
  background:
    linear-gradient(
      180deg,
      rgba(255,209,102,.95),
      rgba(255,209,102,.65)
    );
}

.note.c{
  background:
    linear-gradient(
      180deg,
      rgba(102,227,255,.95),
      rgba(102,227,255,.65)
    );
}

.note.d{
  background:
    linear-gradient(
      180deg,
      rgba(167,139,250,.95),
      rgba(167,139,250,.65)
    );
}

.note.near-hit{
  filter:
    brightness(1.25)
    drop-shadow(
      0 0 12px rgba(255,255,255,.22)
    );

  transform:
    translateY(var(--note-y))
    scale(1.025);
}

/* =========================================================
   FEEDBACK
========================================================= */

#feedback{
  position:absolute;

  left:50%;
  top:41%;

  transform:translate(-50%,-50%);

  z-index:10;

  pointer-events:none;

  font-size:17px;
  font-weight:900;

  letter-spacing:.08em;

  opacity:0;

  white-space:nowrap;

  text-shadow:0 0 14px rgba(255,255,255,.18);
}

#feedback.show{
  animation:feedback .42s ease-out forwards;
}

#feedback.good{
  color:var(--good);
}

#feedback.perfect{
  color:var(--c3);
}

#feedback.bad{
  color:var(--bad);
}

@keyframes feedback{
  0%{
    opacity:0;
    transform:translate(-50%,-40%) scale(.8);
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:translate(-50%,-90%) scale(1.05);
  }
}

/* =========================================================
   MISS FLASH
========================================================= */

#play.miss{
  animation:missFlash .22s ease-out;
}

@keyframes missFlash{
  0%{
    box-shadow:
      0 18px 60px rgba(0,0,0,.35),
      inset 0 0 0 rgba(255,80,90,0);
  }

  45%{
    box-shadow:
      0 18px 60px rgba(0,0,0,.35),
      inset 0 0 45px rgba(255,80,90,.13);
  }

  100%{
    box-shadow:
      0 18px 60px rgba(0,0,0,.35),
      inset 0 0 0 rgba(255,80,90,0);
  }
}

/* =========================================================
   COUNTDOWN
========================================================= */

#countdown{
  position:absolute;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:20;

  font-size:58px;
  font-weight:900;

  pointer-events:none;

  text-shadow:
    0 0 30px rgba(255,255,255,.18);

  opacity:0;
}

#countdown.show{
  animation:countdown .72s ease-out forwards;
}

@keyframes countdown{
  0%{
    opacity:0;
    transform:scale(1.35);
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:scale(.9);
  }
}

/* =========================================================
   OVERLAY
========================================================= */

#overlay{
  position:absolute;

  inset:0;

  z-index:30;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:30px;

  text-align:center;

  background:
    radial-gradient(
      circle at center,
      rgba(8,9,13,.72),
      rgba(8,9,13,.96)
    );

  backdrop-filter:blur(4px);
}

#overlay.hidden{
  display:none;
}

.overlay-title{
  font-size:25px;
  font-weight:900;

  letter-spacing:.08em;

  margin-bottom:8px;
}

.overlay-text{
  max-width:285px;

  color:var(--muted);

  font-size:13px;

  line-height:1.5;

  margin-bottom:22px;
}

#start-btn,
#again-btn{
  border:1px solid rgba(255,255,255,.18);

  border-radius:12px;

  padding:12px 24px;

  color:var(--text);

  background:rgba(255,255,255,.07);

  cursor:pointer;

  font-weight:800;

  letter-spacing:.04em;

  transition:
    transform .12s ease,
    background .12s ease,
    border-color .12s ease;
}

#start-btn:hover,
#again-btn:hover{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.3);
}

#start-btn:active,
#again-btn:active{
  transform:scale(.96);
}

.result{
  margin:0 0 4px;

  font-size:13px;

  color:var(--muted);
}

.result strong{
  color:var(--text);

  font-size:28px;
}

.new-record{
  color:var(--good);

  font-size:12px;

  font-weight:800;

  margin:6px 0 18px;
}

/* =========================================================
   HELP
========================================================= */

.help{
  width:100%;
  max-width:390px;

  margin:12px auto 0;

  text-align:center;

  color:var(--muted);

  font-size:11px;

  line-height:1.5;
}

.help strong{
  color:rgba(255,255,255,.65);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-height:700px){

  #app{
    padding-top:10px;
  }

  .top{
    margin-bottom:8px;
  }

  .info{
    margin-bottom:6px;
  }

  .help{
    margin-top:7px;
  }
}

@media (min-width:600px){

  #app{
    padding-top:28px;
  }

}
</style>
</head>

<body>

<div id="app">

  <div class="top">

    <a class="back" href="../index.html">
      ← Arcade
    </a>

    <div class="title-wrap">

      <h1>SIGUE EL RITMO</h1>

      <div class="subtitle">
        No pierdas el ritmo
      </div>

    </div>

    <div class="best">

      RÉCORD

      <strong id="best">0</strong>

    </div>

  </div>


  <div class="info">

    <div>
      PUNTOS
      <strong id="score">0</strong>
    </div>

    <div id="lives">

      <span class="life"></span>
      <span class="life"></span>
      <span class="life"></span>

    </div>

    <div>
      COMBO
      <strong id="combo-top">0</strong>
    </div>

  </div>


  <div id="play">

    <div id="lanes">

      <div class="lane" data-lane="0">
        <span class="lane-key">A</span>
      </div>

      <div class="lane" data-lane="1">
        <span class="lane-key">S</span>
      </div>

      <div class="lane" data-lane="2">
        <span class="lane-key">D</span>
      </div>

    </div>


    <!--
      Esta es ahora la única referencia horizontal
      importante del juego.
    -->

    <div id="hit-zone"></div>

    <div id="feedback"></div>

    <div id="combo"></div>

    <div id="countdown"></div>


    <div id="overlay">

      <div class="overlay-title">
        SIGUE EL RITMO
      </div>

      <div class="overlay-text">
        Toca el carril cuando la nota llegue
        a la zona iluminada.
        Tienes 3 vidas.
      </div>

      <button id="start-btn">
        EMPEZAR
      </button>

    </div>

  </div>


  <div class="help">

    <strong>Móvil:</strong>
    toca cualquier punto del carril ·

    <strong>PC:</strong>
    A · S · D

  </div>

</div>


<script src="../assets/companion.js"></script>

<script>
(() => {

  /* ========================================================
     CONFIGURACIÓN
  ======================================================== */

  const KEY =
    'miniArcade.ritmo.best';

  /*
    Velocidad inicial.
    El juego irá acelerando progresivamente.
  */

  const START_BPM = 104;

  const MAX_BPM = 132;

  /*
    Cada X beats aumenta ligeramente la dificultad.
  */

  const DIFFICULTY_STEP = 18;

  /*
    Tiempo que tarda una nota desde que aparece
    hasta la zona de golpe.
  */

  const TRAVEL = 1850;

  /*
    Ventana de golpe.

    150 ms es bastante jugable en móvil,
    pero exige seguir el ritmo.
  */

  const HIT_WINDOW = 150;

  /*
    Posición de la zona de golpe.
  */

  const HIT_Y_RATIO = .68;

  const START_DELAY = 1150;

  const MAX_LIVES = 3;


  /* ========================================================
     ELEMENTOS
  ======================================================== */

  const play =
    document.getElementById('play');

  const lanes =
    [...document.querySelectorAll('.lane')];

  const lifeEls =
    [...document.querySelectorAll('.life')];

  const overlay =
    document.getElementById('overlay');

  const startBtn =
    document.getElementById('start-btn');

  const scoreEl =
    document.getElementById('score');

  const comboTopEl =
    document.getElementById('combo-top');

  const comboEl =
    document.getElementById('combo');

  const bestEl =
    document.getElementById('best');

  const feedbackEl =
    document.getElementById('feedback');

  const countdownEl =
    document.getElementById('countdown');

  const hitZone =
    document.getElementById('hit-zone');


  /* ========================================================
     ESTADO
  ======================================================== */

  let best = 0;

  let score = 0;

  let combo = 0;

  let maxCombo = 0;

  let lives = MAX_LIVES;

  let running = false;

  let animationFrame = 0;

  let notes = [];

  /*
    Próximo beat que se generará.
  */

  let nextBeatTime = 0;

  let beatIndex = 0;

  let lastLane = 1;

  let startTime = 0;


  /* ========================================================
     RÉCORD
  ======================================================== */

  try{

    best =
      parseInt(
        sessionStorage.getItem(KEY),
        10
      ) || 0;

  }catch(e){

    best = 0;

  }

  bestEl.textContent =
    best;


  /* ========================================================
     BLIP
  ======================================================== */

  function blipPlay(gesture){

    try{

      if(
        window.Companion &&
        typeof Companion.play === 'function'
      ){

        Companion.play(
          gesture
        );

      }

    }catch(e){}

  }


  /* ========================================================
     AUDIO
  ======================================================== */

  let audioCtx = null;

  function initAudio(){

    try{

      if(!audioCtx){

        audioCtx =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }

      if(
        audioCtx.state ===
        'suspended'
      ){

        audioCtx.resume();

      }

    }catch(e){}

  }


  function tone(
    frequency,
    duration=.06,
    type='sine',
    volume=.025
  ){

    if(!audioCtx){
      return;
    }

    try{

      const now =
        audioCtx.currentTime;

      const oscillator =
        audioCtx.createOscillator();

      const gain =
        audioCtx.createGain();

      oscillator.type =
        type;

      oscillator.frequency
        .setValueAtTime(
          frequency,
          now
        );

      gain.gain
        .setValueAtTime(
          volume,
          now
        );

      gain.gain
        .exponentialRampToValueAtTime(
          .0001,
          now + duration
        );

      oscillator.connect(gain);

      gain.connect(
        audioCtx.destination
      );

      oscillator.start(now);

      oscillator.stop(
        now + duration
      );

    }catch(e){}

  }


  /* ========================================================
     DIFICULTAD
  ======================================================== */

  function getDifficulty(){

    /*
      0 al principio.
      1 cada vez más rápido.

      Nunca supera MAX_BPM.
    */

    return Math.min(
      1,
      Math.floor(
        beatIndex /
        DIFFICULTY_STEP
      ) / 6
    );

  }


  function getBPM(){

    const difficulty =
      getDifficulty();

    return (
      START_BPM +
      (MAX_BPM - START_BPM) *
      difficulty
    );

  }


  function getBeatDuration(){

    return (
      60000 /
      getBPM()
    );

  }


  /* ========================================================
     PATRÓN
  ======================================================== */

  /*
    Genera el siguiente patrón de forma progresiva.

    Al principio:
      - muchos cambios sencillos
      - pocas repeticiones
      - prácticamente ninguna doble

    Más adelante:
      - repeticiones
      - cambios rápidos
      - dobles
      - secuencias de 2-3 carriles
  */

  function makeNextPattern(){

    const difficulty =
      getDifficulty();

    const r =
      Math.random();


    /* -----------------------------------------------
       Primeros beats: enseñar el juego
    ------------------------------------------------ */

    if(beatIndex < 5){

      lastLane =
        (lastLane + 1) % 3;

      return {
        lanes:[lastLane]
      };

    }


    /* -----------------------------------------------
       DOBLE NOTA
    ------------------------------------------------ */

    const doubleChance =
      .04 +
      difficulty * .18;

    if(
      r < doubleChance &&
      beatIndex > 12
    ){

      let other;

      do{

        other =
          Math.floor(
            Math.random() * 3
          );

      }while(
        other === lastLane
      );

      return {
        lanes:[
          lastLane,
          other
        ]
      };

    }


    /* -----------------------------------------------
       CAMBIO DE CARRIL
    ------------------------------------------------ */

    let lane;

    /*
      A mayor dificultad, menos probabilidad
      de repetir carril.
    */

    const stayChance =
      .34 -
      difficulty * .16;

    if(
      r < stayChance
    ){

      lane =
        lastLane;

    }else{

      /*
        Evitamos saltos artificialmente predecibles.
      */

      const direction =
        Math.random() < .5
          ? 1
          : -1;

      lane =
        lastLane +
        direction;

      if(lane < 0){
        lane = 1;
      }

      if(lane > 2){
        lane = 1;
      }

    }


    lastLane =
      lane;


    /* -----------------------------------------------
       SECUENCIAS ESPECIALES
    ------------------------------------------------ */

    /*
      Cada cierto tiempo introducimos un cambio
      más marcado para romper monotonía.
    */

    if(
      beatIndex % 11 === 0 &&
      difficulty > .15
    ){

      lane =
        (lastLane + 1) % 3;

      lastLane =
        lane;

    }


    return {
      lanes:[lane]
    };

  }


  /* ========================================================
     SPAWN
  ======================================================== */

  function spawnNote(
    laneIndex,
    targetTime
  ){

    const el =
      document.createElement(
        'div'
      );

    el.className =
      'note ' +
      ['a','b','c','d'][
        laneIndex % 4
      ];

    el.style.left =
      (
        laneIndex *
        100 /
        3
      ) + '%';

    el.dataset.lane =
      laneIndex;

    play.appendChild(el);

    notes.push({

      el,

      lane:
        laneIndex,

      targetTime,

      hit:false,

      missed:false

    });

  }


  /* ========================================================
     GENERAR NOTAS INFINITAMENTE
  ======================================================== */

  function spawnUntil(now){

    /*
      Mientras el siguiente beat esté suficientemente
      cerca como para tener que aparecer en pantalla,
      seguimos generando.
    */

    while(
      nextBeatTime - now <=
      TRAVEL
    ){

      const pattern =
        makeNextPattern();


      pattern.lanes.forEach(
        lane => {

          spawnNote(
            lane,
            nextBeatTime
          );

        }
      );


      beatIndex++;


      /*
        El intervalo cambia progresivamente.
      */

      nextBeatTime +=
        getBeatDuration();

    }

  }


  /* ========================================================
     POSICIÓN DE NOTA
  ======================================================== */

  function noteY(
    note,
    now
  ){

    const h =
      play.getBoundingClientRect()
        .height;

    const hitY =
      h * HIT_Y_RATIO;

    const startY =
      -90;

    const progress =
      1 -
      (
        note.targetTime -
        now
      ) /
      TRAVEL;

    return (
      startY +
      (
        hitY -
        startY
      ) *
      progress
    );

  }


  /* ========================================================
     FEEDBACK
  ======================================================== */

  function feedback(
    text,
    type
  ){

    feedbackEl.textContent =
      text;

    feedbackEl.className =
      '';

    void feedbackEl.offsetWidth;

    feedbackEl.className =
      'show ' +
      type;

  }


  /* ========================================================
     VIDAS
  ======================================================== */

  function updateLives(){

    lifeEls.forEach(
      (life,index) => {

        life.classList.toggle(
          'lost',
          index >= lives
        );

      }
    );

  }


  function loseLife(){

    if(!running){
      return;
    }

    lives--;

    updateLives();

    combo = 0;

    comboTopEl.textContent =
      '0';

    comboEl.textContent =
      '';

    feedback(
      lives > 0
        ? '¡FALLO!'
        : 'GAME OVER',
      'bad'
    );

    tone(
      180,
      .1,
      'sawtooth',
      .022
    );

    blipPlay(
      lives > 0
        ? 'sad'
        : 'sleep'
    );


    play.classList.remove(
      'miss'
    );

    void play.offsetWidth;

    play.classList.add(
      'miss'
    );


    if(lives <= 0){

      setTimeout(
        finishGame,
        280
      );

    }

  }


  /* ========================================================
     HIT
  ======================================================== */

  function hitNote(
    note,
    delta
  ){

    if(
      note.hit ||
      note.missed
    ){

      return;

    }


    note.hit = true;


    const perfect =
      delta <= 60;

    const good =
      delta <= 115;


    if(perfect){

      score += 30;

      feedback(
        'PERFECT',
        'perfect'
      );

      tone(
        880,
        .08,
        'sine',
        .035
      );

    }else if(good){

      score += 20;

      feedback(
        'BIEN',
        'good'
      );

      tone(
        660,
        .07,
        'sine',
        .028
      );

    }else{

      score += 10;

      feedback(
        'OK',
        'good'
      );

      tone(
        520,
        .06,
        'sine',
        .024
      );

    }


    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    /*
      Bonus por mantener el ritmo.
    */

    if(combo >= 5){

      score +=
        Math.min(
          20,
          Math.floor(
            combo / 5
          ) * 2
        );

    }


    scoreEl.textContent =
      score;

    comboTopEl.textContent =
      combo;


    comboEl.textContent =
      combo >= 2
        ? combo + '× COMBO'
        : '';


    comboEl.classList.remove(
      'hot'
    );

    void comboEl.offsetWidth;

    if(combo >= 2){

      comboEl.classList.add(
        'hot'
      );

    }


    note.el.style.opacity =
      '0';

    setTimeout(
      () => {

        if(
          note.el.parentNode
        ){

          note.el.remove();

        }

      },
      100
    );


    blipPlay(
      perfect
        ? 'cheer'
        : 'wave'
    );

  }


  /* ========================================================
     MISS DE UNA NOTA
  ======================================================== */

  function missNote(note){

    if(
      note.hit ||
      note.missed
    ){

      return;

    }

    note.missed = true;

    loseLife();


    note.el.style.opacity =
      '0';

    setTimeout(
      () => {

        if(
          note.el.parentNode
        ){

          note.el.remove();

        }

      },
      100
    );

  }


  /* ========================================================
     INPUT
  ======================================================== */

  function tapLane(
    laneIndex
  ){

    if(!running){
      return;
    }


    const now =
      performance.now();


    let candidate =
      null;

    let bestDelta =
      Infinity;


    for(
      const note of notes
    ){

      if(
        note.hit ||
        note.missed ||
        note.lane !== laneIndex
      ){

        continue;

      }


      const delta =
        Math.abs(
          now -
          note.targetTime
        );


      if(
        delta <
        bestDelta
      ){

        bestDelta =
          delta;

        candidate =
          note;

      }

    }


    if(
      candidate &&
      bestDelta <=
      HIT_WINDOW
    ){

      hitNote(
        candidate,
        bestDelta
      );

    }

  }


  /* ========================================================
     POINTER / MÓVIL
  ======================================================== */

  lanes.forEach(
    (lane,index) => {

      lane.addEventListener(
        'pointerdown',
        event => {

          event.preventDefault();

          initAudio();

          tapLane(index);

        },
        {
          passive:false
        }
      );

    }
  );


  /* ========================================================
     TECLADO
  ======================================================== */

  document.addEventListener(
    'keydown',
    event => {

      if(event.repeat){
        return;
      }


      const key =
        event.key.toLowerCase();


      if(key === 'a'){
        tapLane(0);
      }

      if(key === 's'){
        tapLane(1);
      }

      if(key === 'd'){
        tapLane(2);
      }


      if(
        key === 'a' ||
        key === 's' ||
        key === 'd'
      ){

        event.preventDefault();

      }

    }
  );


  /* ========================================================
     UPDATE
  ======================================================== */

  function updateNotes(now){

    const h =
      play.getBoundingClientRect()
        .height;

    const hitY =
      h * HIT_Y_RATIO;


    const readyLanes =
      new Set();


    notes.forEach(
      note => {

        if(
          note.hit ||
          note.missed
        ){

          return;

        }


        const y =
          noteY(
            note,
            now
          );


        note.el.style.setProperty(
          '--note-y',
          y + 'px'
        );


        note.el.style.transform =
          'translateY(' +
          y +
          'px)';


        const center =
          y + 27;


        const near =
          Math.abs(
            center -
            hitY
          ) < 55;


        note.el.classList.toggle(
          'near-hit',
          near
        );


        if(near){

          readyLanes.add(
            note.lane
          );

        }


        /*
          Si la nota ya ha pasado la ventana
          de golpe, se pierde una vida.
        */

        if(
          now -
          note.targetTime >
          HIT_WINDOW
        ){

          missNote(
            note
          );

        }

      }
    );


    lanes.forEach(
      (lane,index) => {

        lane.classList.toggle(
          'ready',
          readyLanes.has(index)
        );

      }
    );


    hitZone.classList.toggle(
      'ready',
      readyLanes.size > 0
    );


    removeOldNotes();

  }


  /* ========================================================
     LIMPIEZA
  ======================================================== */

  function removeOldNotes(){

    notes =
      notes.filter(
        note => {

          return !(
            note.hit ||
            note.missed
          );

        }
      );

  }


  /* ========================================================
     LOOP
  ======================================================== */

  function loop(now){

    if(!running){
      return;
    }


    /*
      Generación infinita.
    */

    spawnUntil(now);


    /*
      Movimiento.
    */

    updateNotes(now);


    /*
      Si todavía hay vidas seguimos.
    */

    if(
      running &&
      lives > 0
    ){

      animationFrame =
        requestAnimationFrame(
          loop
        );

    }

  }


  /* ========================================================
     COUNTDOWN
  ======================================================== */

  function countdown(){

    return new Promise(
      resolve => {

        const values =
          [
            '3',
            '2',
            '1',
            '¡YA!'
          ];

        let index = 0;


        function next(){

          if(
            index >=
            values.length
          ){

            countdownEl.className =
              '';

            resolve();

            return;

          }


          countdownEl.textContent =
            values[index];

          countdownEl.className =
            'show';

          void countdownEl.offsetWidth;


          index++;


          setTimeout(
            next,
            index ===
              values.length
              ? 420
              : 700
          );

        }


        next();

      }
    );

  }


  /* ========================================================
     START
  ======================================================== */

  async function startGame(){

    initAudio();


    cancelAnimationFrame(
      animationFrame
    );


    notes.forEach(
      note => {

        if(
          note.el.parentNode
        ){

          note.el.remove();

        }

      }
    );


    notes = [];


    score = 0;

    combo = 0;

    maxCombo = 0;

    lives = MAX_LIVES;

    beatIndex = 0;

    lastLane = 1;


    scoreEl.textContent =
      '0';

    comboTopEl.textContent =
      '0';

    comboEl.textContent =
      '';


    updateLives();


    lanes.forEach(
      lane =>
        lane.classList.remove(
          'ready'
        )
    );


    hitZone.classList.remove(
      'ready'
    );


    feedbackEl.className =
      '';


    overlay.classList.add(
      'hidden'
    );


    running = false;


    await countdown();


    startTime =
      performance.now();


    /*
      El primer beat se coloca después
      del pequeño retraso inicial.
    */

    nextBeatTime =
      startTime +
      START_DELAY;


    running = true;


    animationFrame =
      requestAnimationFrame(
        loop
      );

  }


  /* ========================================================
     FIN
  ======================================================== */

  function finishGame(){

    if(!running){
      return;
    }


    running = false;


    cancelAnimationFrame(
      animationFrame
    );


    lanes.forEach(
      lane =>
        lane.classList.remove(
          'ready'
        )
    );


    hitZone.classList.remove(
      'ready'
    );


    notes.forEach(
      note => {

        if(
          note.el.parentNode
        ){

          note.el.remove();

        }

      }
    );


    notes = [];


    let record = false;


    if(score > best){

      best = score;

      record = true;


      try{

        sessionStorage.setItem(
          KEY,
          String(best)
        );

      }catch(e){}


      bestEl.textContent =
        best;


      blipPlay(
        'cheer'
      );

    }else{

      blipPlay(
        'sad'
      );

    }


    showEndScreen(
      record
    );

  }


  /* ========================================================
     END SCREEN
  ======================================================== */

  function showEndScreen(
    record
  ){

    overlay.innerHTML = `

      <div class="overlay-title">
        GAME OVER
      </div>

      <div class="result">
        PUNTUACIÓN
        <strong>${score}</strong>
      </div>

      <div class="result">
        COMBO MÁXIMO
        <strong>${maxCombo}</strong>
      </div>

      ${
        record
          ? `
            <div class="new-record">
              ★ NUEVO RÉCORD ★
            </div>
          `
          : `
            <div style="height:18px"></div>
          `
      }

      <button id="again-btn">
        JUGAR OTRA VEZ
      </button>

    `;


    overlay.classList.remove(
      'hidden'
    );


    document
      .getElementById(
        'again-btn'
      )
      .addEventListener(
        'click',
        startGame
      );

  }


  /* ========================================================
     START BUTTON
  ======================================================== */

  startBtn.addEventListener(
    'click',
    startGame
  );

})();
</script>

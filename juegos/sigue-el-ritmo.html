<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sigue el Ritmo · Mini Arcade</title>
<link rel="manifest" href="../manifest.json"><link rel="icon" href="../assets/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png"><meta name="theme-color" content="#14121f">
<link rel="stylesheet" href="../assets/theme.css"><link rel="stylesheet" href="../assets/companion.css">
<style>
#game-root{display:flex;flex-direction:column;align-items:center;width:100%}
#hud{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stat{border:1px solid var(--grid);background:var(--panel);padding:7px 3px;text-align:center}.stat b{display:block;font-size:7px;color:var(--dim);margin-bottom:3px}.stat span{font-size:10px;color:var(--ink)}
#hud2{width:100%;max-width:440px;display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.mini-btn{font-family:inherit;font-size:10px;background:transparent;color:var(--dim);border:1px solid var(--grid);padding:9px 12px;min-height:36px;cursor:pointer;touch-action:manipulation}
.mini-btn:hover{color:var(--ink);border-color:var(--dim)}
.blip-watch{display:flex;justify-content:center;margin-bottom:8px}
#play{position:relative;width:100%;max-width:440px;aspect-ratio:1.25;border:3px solid var(--grid);background:var(--panel);box-shadow:0 0 0 4px var(--bg),6px 6px 0 rgba(0,0,0,.35);overflow:hidden;touch-action:none}
#track{position:absolute;left:7%;right:7%;top:50%;height:68px;transform:translateY(-50%);border-top:1px solid var(--grid);border-bottom:1px solid var(--grid)}
#target{position:absolute;left:22%;top:0;bottom:0;width:54px;transform:translateX(-50%);border-left:2px solid var(--c3);border-right:2px solid var(--c3);background:rgba(255,255,255,.025)}
#target:after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid var(--c3);transform:translate(-50%,-50%) rotate(45deg)}
.note{position:absolute;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);box-shadow:2px 2px 0 rgba(0,0,0,.3);border:2px solid rgba(0,0,0,.35)}
.note.a{background:var(--c1);clip-path:circle(50%)}.note.b{background:var(--c2);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.note.c{background:var(--c3);clip-path:polygon(50% 0,0 100%,100% 100%)}.note.d{background:var(--c4);clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
#feedback{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);font-size:14px;color:var(--ink);opacity:0;pointer-events:none;z-index:2}#feedback.show{animation:pop .55s ease}
#combo{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);font-size:9px;color:var(--dim);letter-spacing:.7px}
#overlay{position:absolute;inset:0;background:rgba(20,18,31,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:18px;z-index:5}
#overlay h2{font-size:14px;margin:0;color:var(--c3)}#overlay p{font-size:9px;color:var(--dim);line-height:1.9;margin:0;max-width:340px}
#result{display:none;font-size:10px;color:var(--ink);line-height:2}#overlay button{font-family:inherit;font-size:11px;background:var(--c2);color:#14121f;border:0;padding:13px 20px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
#foot{margin-top:10px;font-size:8px;color:var(--dim);text-align:center;line-height:1.8}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}
@media(max-width:360px){#hud{grid-template-columns:repeat(2,1fr)}#target{width:46px}.note{width:25px;height:25px}}
</style></head>
<body>
<div class="top-nav"><a class="back-link" href="../index.html">← MENÚ</a><span class="page-title">SIGUE EL RITMO</span></div>
<div id="game-root">
<div id="hud">
<div class="stat"><b>PUNTOS</b><span id="score">0</span></div><div class="stat"><b>COMBO</b><span id="combo-v">0</span></div>
<div class="stat"><b>RITMO</b><span id="mult">1x</span></div><div class="stat"><b>MEJOR</b><span id="best">—</span></div></div>
<div id="hud2"><button class="mini-btn" id="mute">SONIDO: ON</button><button class="mini-btn" id="restart">REINICIAR</button></div>
<div class="blip-watch" id="blip-slot"></div>
<div id="play"><div id="track"><div id="target"></div></div><div id="feedback"></div><div id="combo"></div>
<div id="overlay"><h2 id="title">SIGUE EL RITMO</h2><p id="text">Las notas avanzan hacia la zona marcada. Tócalas justo cuando lleguen. Cuanto mejor sea el timing, más puntos y más combo.</p><div id="result"></div><button id="start">EMPEZAR</button></div></div>
<div id="foot">toca la nota cuando cruce la zona · ritmo generado en el navegador</div>
</div>
<script>
(()=>{const play=document.getElementById('play'),track=document.getElementById('track'),ov=document.getElementById('overlay'),
title=document.getElementById('title'),text=document.getElementById('text'),result=document.getElementById('result'),start=document.getElementById('start'),
restart=document.getElementById('restart'),mute=document.getElementById('mute'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo-v'),
multEl=document.getElementById('mult'),bestEl=document.getElementById('best'),feedback=document.getElementById('feedback'),comboText=document.getElementById('combo');
const KEY='miniArcade.ritmo.best',BPM=112,BEAT=60000/BPM,N=64,TRAVEL=1450,WINDOW=125;
let best=0,running=false,muted=false,ctx=null,raf=0,notes=[],i=0,next=0,score=0,combo=0,maxCombo=0,pattern=[];
try{best=parseInt(sessionStorage.getItem(KEY),10)||0}catch(e){}
function upd(){scoreEl.textContent=score;comboEl.textContent=combo;multEl.textContent=Math.min(4,1+Math.floor(combo/5))+'x';bestEl.textContent=best||'—';comboText.textContent=combo>=3?'COMBO ×'+combo:''}
function audio(){if(!ctx)try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{})}
function tone(f,d,t='square',v=.045){if(muted||!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime;o.type=t;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d)}
function msg(s){feedback.textContent=s;feedback.classList.remove('show');void feedback.offsetWidth;feedback.classList.add('show')}
function makePattern(){let p=[];for(let j=0;j<N;j++)p.push(j%2===0||Math.random()<Math.min(.34,.08+j*.004));return p}
function spawn(t){let e=document.createElement('div');e.className='note '+['a','b','c','d'][Math.floor(Math.random()*4)];track.appendChild(e);notes.push({e,t,hit:0})}
function x(n,now){let w=track.getBoundingClientRect().width,a=w+35,b=w*.22,q=1-(n.t-now)/TRAVEL;return a+(b-a)*q}
function tick(now){if(!running)return;while(now>=next&&i<N){if(pattern[i])spawn(next);tone(i%4?95:150,.045);i++;next+=BEAT}let w=track.getBoundingClientRect().width;notes.forEach(n=>{if(n.hit)return;n.e.style.left=x(n,now)+'px';if(now>n.t+WINDOW){n.hit=1;n.e.remove();combo=0;msg('MISS');tone(220,.09,'sawtooth');upd()}});notes=notes.filter(n=>!n.hit);if(i>=N&&!notes.length)return finish();raf=requestAnimationFrame(tick)}
function tap(){if(!running)return;let now=performance.now(),c=null,d=1e9;notes.forEach(n=>{if(!n.hit){let q=Math.abs(now-n.t);if(q<d){d=q;c=n}}});if(!c||d>WINDOW){combo=0;msg('MISS');tone(220,.09,'sawtooth');upd();return}c.hit=1;c.e.remove();notes=notes.filter(n=>n!==c);let pts=d<=45?100:d<=85?60:30,kind=d<=45?'PERFECT':d<=85?'GOOD':'OK',m=Math.min(4,1+Math.floor(combo/5));score+=pts*m;combo++;maxCombo=Math.max(maxCombo,combo);msg(kind+' +'+pts*m);tone(kind==='PERFECT'?880:660,.07,'triangle');if(window.Companion)Companion.play(combo>=8?'cheer':'wave');upd()}
function finish(){running=false;cancelAnimationFrame(raf);notes.forEach(n=>n.e.remove());notes=[];let record=score>best;if(record){best=score;try{sessionStorage.setItem(KEY,String(best))}catch(e){}}title.textContent=record?'¡NUEVO RÉCORD!':'RITMO COMPLETADO';text.textContent='';result.style.display='block';result.innerHTML='PUNTUACIÓN: <strong>'+score+'</strong><br>COMBO MÁXIMO: '+maxCombo+(record?'':'<br>MEJOR: '+best);start.textContent='REINTENTAR';ov.style.display='flex';[660,830,1040].forEach((f,j)=>setTimeout(()=>tone(f,.09,'triangle'),j*75));if(window.Companion)Companion.play('cheer');upd()}
function begin(){audio();cancelAnimationFrame(raf);notes.forEach(n=>n.e.remove());notes=[];score=0;combo=0;maxCombo=0;i=0;pattern=makePattern();next=performance.now()+900;running=true;ov.style.display='none';result.style.display='none';upd();raf=requestAnimationFrame(tick)}
play.addEventListener('pointerdown',e=>{if(e.target===play||e.target===track||e.target.id==='target')e.preventDefault();tap()});
start.onclick=begin;restart.onclick=begin;mute.onclick=()=>{muted=!muted;mute.textContent='SONIDO: '+(muted?'OFF':'ON');if(!muted)audio()};upd()})()
</script>
<script src="../assets/companion.js"></script><script>Companion.mount(document.getElementById('blip-slot'),{size:36});</script>
<script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));</script>
</body></html>

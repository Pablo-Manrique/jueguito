<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sigue el Ritmo · Mini Arcade</title>

<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">

<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Arcade">

<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/companion.css">

<style>

/* =========================================================
   CONTENEDOR
========================================================= */

#game-root{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}


/* =========================================================
   HUD
========================================================= */

#hud{
  width:100%;
  max-width:440px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:8px;

  font-size:clamp(8px, 2.6vw, 10px);

  letter-spacing:.5px;

  gap:8px;
}

#hud .stat{
  color:var(--dim);
}

#hud .val{
  color:var(--ink);
  margin-left:4px;
}

#combo-val{
  color:var(--c2);
}

#best-val.pop,
#combo-val.pop{
  animation:pop-scale .35s ease;
}


/* =========================================================
   VIDAS
========================================================= */

#lives{
  display:flex;
  align-items:center;
  gap:5px;
}

.life{
  width:10px;
  height:10px;

  border:1px solid var(--c3);

  background:var(--c3);

  box-shadow:
    2px 2px 0 rgba(0,0,0,.25);

  transition:
    opacity .15s ease,
    transform .15s ease;
}

.life.lost{
  opacity:.18;
  transform:scale(.7);

  background:transparent;

  box-shadow:none;
}


/* =========================================================
   TABLERO
========================================================= */

#board{
  position:relative;

  width:100%;
  max-width:440px;

  aspect-ratio:3 / 5.35;

  background:var(--panel);

  border:3px solid var(--grid);

  box-shadow:
    0 0 0 4px var(--bg),
    6px 6px 0 rgba(0,0,0,.35);

  overflow:hidden;

  touch-action:none;
}


/* =========================================================
   FONDO
========================================================= */

#board::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:

    linear-gradient(
      90deg,
      transparent 0,
      rgba(255,255,255,.015) 50%,
      transparent 100%
    );

  opacity:.8;
}


/* =========================================================
   CARRILES
========================================================= */

#lanes{
  position:absolute;
  inset:0;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  z-index:1;
}

.lane{
  position:relative;

  border-right:2px solid var(--grid);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.005),
      transparent
    );

  transition:
    background .08s ease;
}

.lane:last-child{
  border-right:none;
}


/*
   Pequeña guía central vertical.
   Mucho más discreta que la antigua línea horizontal.
*/

.lane::after{
  content:"";

  position:absolute;

  left:50%;
  top:0;
  bottom:0;

  width:1px;

  transform:translateX(-50%);

  background:rgba(255,255,255,.025);

  pointer-events:none;
}

.lane.ready{
  background:
    linear-gradient(
      180deg,
      transparent 50%,
      rgba(61,218,215,.055) 100%
    );
}


/* =========================================================
   TECLAS
========================================================= */

.lane-key{
  position:absolute;

  left:50%;
  bottom:9px;

  transform:translateX(-50%);

  width:38px;
  height:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--dim);

  border:2px solid var(--grid);

  background:var(--bg);

  font-size:10px;

  z-index:4;

  transition:
    color .08s ease,
    border-color .08s ease,
    background .08s ease,
    transform .08s ease;
}

.lane.ready .lane-key{
  color:var(--ink);

  border-color:var(--c2);

  background:
    rgba(61,218,215,.1);

  transform:
    translateX(-50%)
    translateY(-2px);
}


/* =========================================================
   ZONA DE GOLPE
========================================================= */

/*
   IMPORTANTE:
   No hay ninguna segunda línea por encima.
   La zona es una franja translúcida y una única
   referencia fina en el centro.
*/

#hit-zone{
  position:absolute;

  left:0;
  right:0;

  bottom:25%;

  height:78px;

  background:
    rgba(61,218,215,.055);

  z-index:3;

  pointer-events:none;

  transition:
    background .08s ease,
    box-shadow .08s ease;
}


/*
   Única línea de referencia.
   Fina y centrada dentro de la zona.
*/

#hit-zone::before{
  content:"";

  position:absolute;

  left:0;
  right:0;

  top:50%;

  height:2px;

  transform:translateY(-50%);

  background:var(--c2);

  box-shadow:
    0 0 7px rgba(61,218,215,.35);
}

#hit-zone.ready{
  background:
    rgba(61,218,215,.10);

  box-shadow:
    inset 0 0 25px rgba(61,218,215,.05);
}

#hit-zone.ready::before{
  box-shadow:
    0 0 12px rgba(61,218,215,.6);
}


/* =========================================================
   NOTAS
========================================================= */

.note{
  position:absolute;

  top:0;

  width:33.3333%;
  height:52px;

  border:2px solid rgba(255,255,255,.13);

  z-index:5;

  transform:translateY(-80px);

  box-shadow:
    4px 4px 0 rgba(0,0,0,.28);

  transition:
    filter .07s ease,
    opacity .09s ease;
}


/*
   Interior pixelado.
*/

.note::after{
  content:"";

  position:absolute;

  inset:5px;

  border:1px solid rgba(255,255,255,.25);

  pointer-events:none;
}


/* Colores */

.note.a{
  background:var(--c1);
}

.note.b{
  background:var(--c2);
}

.note.c{
  background:var(--c3);
}

.note.d{
  background:var(--c4);
}


/*
   Cuando está cerca del punto correcto.
*/

.note.near-hit{
  filter:
    brightness(1.15);

  box-shadow:
    0 0 12px rgba(255,255,255,.22),
    4px 4px 0 rgba(0,0,0,.22);
}


/* =========================================================
   FEEDBACK
========================================================= */

#feedback{
  position:absolute;

  left:50%;
  top:42%;

  transform:translate(-50%,-50%);

  z-index:10;

  pointer-events:none;

  font-size:clamp(10px,3vw,12px);

  font-weight:bold;

  letter-spacing:.5px;

  opacity:0;

  white-space:nowrap;
}

#feedback.show{
  animation:feedback .42s ease-out forwards;
}

#feedback.perfect{
  color:var(--c2);
}

#feedback.good{
  color:var(--c3);
}

#feedback.bad{
  color:var(--c1);
}

@keyframes feedback{

  0%{
    opacity:0;
    transform:
      translate(-50%,-40%)
      scale(.8);
  }

  18%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-90%)
      scale(1.05);
  }

}


/* =========================================================
   FLASH DE FALLO
========================================================= */

#board.miss{
  animation:shake .24s ease;
}

@keyframes shake{

  0%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-4px);
  }

  40%{
    transform:translateX(4px);
  }

  60%{
    transform:translateX(-3px);
  }

  80%{
    transform:translateX(2px);
  }

  100%{
    transform:translateX(0);
  }

}


/* =========================================================
   COMBO
========================================================= */

#combo{
  position:absolute;

  left:50%;
  bottom:6%;

  transform:translateX(-50%);

  z-index:8;

  color:var(--c3);

  font-size:clamp(9px,2.8vw,11px);

  white-space:nowrap;

  pointer-events:none;

  opacity:.9;
}

#combo.pop{
  animation:pop-scale .3s ease;
}


/* =========================================================
   COUNTDOWN
========================================================= */

#countdown{
  position:absolute;

  inset:0;

  display:flex;

  justify-content:center;
  align-items:center;

  z-index:20;

  color:var(--c3);

  font-size:clamp(28px,11vw,52px);

  opacity:0;

  pointer-events:none;

  text-shadow:
    4px 4px 0 rgba(0,0,0,.35);
}

#countdown.show{
  animation:countdown .65s ease-out forwards;
}

@keyframes countdown{

  0%{
    opacity:0;
    transform:scale(1.35);
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:scale(.9);
  }

}


/* =========================================================
   OVERLAY
========================================================= */

#overlay{
  position:absolute;
  inset:0;

  z-index:30;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:13px;

  padding:20px;

  text-align:center;

  background:
    rgba(20,18,31,.94);
}

#overlay.hidden{
  display:none;
}

#overlay h2{
  margin:0;

  font-size:clamp(12px,4vw,15px);

  color:var(--c3);
}

#overlay.lost h2{
  color:var(--c1);
}

#overlay p{
  margin:0;

  max-width:330px;

  color:var(--dim);

  font-size:clamp(8px,2.5vw,9px);

  line-height:1.9;
}

#overlay-score{
  color:var(--ink);

  font-size:clamp(9px,2.8vw,11px);
}

#overlay button{

  font-family:inherit;

  font-size:clamp(9px,2.8vw,10px);

  background:var(--c1);

  color:#14121f;

  border:none;

  padding:13px 20px;

  cursor:pointer;

  box-shadow:
    3px 3px 0 rgba(0,0,0,.4);

  touch-action:manipulation;
}

#overlay button:active{

  transform:
    translate(2px,2px);

  box-shadow:
    1px 1px 0 rgba(0,0,0,.4);
}


/* =========================================================
   AYUDA
========================================================= */

#foot-note{

  margin-top:10px;

  max-width:440px;

  color:var(--dim);

  text-align:center;

  font-size:clamp(7px,2vw,8px);

  line-height:1.8;
}


/* =========================================================
   ANIMACIONES HUD
========================================================= */

@keyframes pop-scale{

  0%{
    transform:scale(1);
  }

  40%{
    transform:
      scale(1.45)
      rotate(-4deg);
  }

  70%{
    transform:scale(.9);
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-height:700px){

  body{
    padding-top:12px;
  }

  .top-nav{
    margin-bottom:10px;
  }

}

</style>
</head>

<body>

  <div class="top-nav">
    <a class="back-link" href="../index.html">← MENÚ</a>
    <span class="page-title">SIGUE EL RITMO</span>
  </div>


  <div id="game-root">


    <!-- HUD -->

    <div id="hud">

      <div>
        <span class="stat">PUNTOS</span>
        <span class="val" id="score-val">0</span>
      </div>


      <div>
        <span class="stat">COMBO</span>
        <span class="val" id="combo-val">0</span>
      </div>


      <div id="lives">

        <span class="life"></span>
        <span class="life"></span>
        <span class="life"></span>

      </div>


      <div>
        <span class="stat">MEJOR</span>
        <span class="val" id="best-val">0</span>
      </div>

    </div>


    <!-- TABLERO -->

    <div id="board">


      <!-- CARRILES -->

      <div id="lanes">

        <div class="lane" data-lane="0">
          <span class="lane-key">A</span>
        </div>

        <div class="lane" data-lane="1">
          <span class="lane-key">S</span>
        </div>

        <div class="lane" data-lane="2">
          <span class="lane-key">D</span>
        </div>

      </div>


      <!-- ZONA DE GOLPE -->

      <div id="hit-zone"></div>


      <!-- FEEDBACK -->

      <div id="feedback"></div>

      <div id="combo"></div>

      <div id="countdown"></div>


      <!-- PANTALLA INICIAL -->

      <div id="overlay">

        <h2>SIGUE EL RITMO</h2>

        <p>
          Toca cada carril cuando la nota
          llegue a la zona de golpe.
          Mantén el ritmo y aguanta
          todo lo que puedas.
          Tienes 3 vidas.
        </p>

        <button id="start-btn">
          EMPEZAR
        </button>

      </div>

    </div>


    <div id="foot-note">
      móvil: toca cualquier punto del carril
      &middot;
      PC: A &middot; S &middot; D
    </div>

  </div>


<script src="../assets/companion.js"></script>

<script>
(() => {

  /* ========================================================
     CONFIGURACIÓN
  ======================================================== */

  const BEST_KEY =
    'miniArcade.ritmo.best';

  const START_BPM = 104;

  const MAX_BPM = 132;

  const HIT_WINDOW = 150;

  const HIT_Y_RATIO = .68;

  const HIT_ZONE_HEIGHT = 78;

  const TRAVEL = 1850;

  const START_DELAY = 1150;

  const MAX_LIVES = 3;

  const BEATS_PER_MEASURE = 4;


  /* ========================================================
     ELEMENTOS
  ======================================================== */

  const board =
    document.getElementById('board');

  const lanes =
    [...document.querySelectorAll('.lane')];

  const lifeEls =
    [...document.querySelectorAll('.life')];

  const overlay =
    document.getElementById('overlay');

  const startBtn =
    document.getElementById('start-btn');

  const scoreEl =
    document.getElementById('score-val');

  const comboEl =
    document.getElementById('combo-val');

  const comboDisplay =
    document.getElementById('combo');

  const bestEl =
    document.getElementById('best-val');

  const feedbackEl =
    document.getElementById('feedback');

  const countdownEl =
    document.getElementById('countdown');

  const hitZone =
    document.getElementById('hit-zone');


  /* ========================================================
     ESTADO
  ======================================================== */

  let score = 0;

  let combo = 0;

  let maxCombo = 0;

  let lives = MAX_LIVES;

  let best = 0;

  let running = false;

  let raf = 0;

  let notes = [];

  let nextMeasureTime = 0;

  let measureIndex = 0;

  let producedEvents = 0;

  let lastLane = 1;

  let audioCtx = null;


  /* ========================================================
     RÉCORD
  ======================================================== */

  try{

    best =
      parseInt(
        sessionStorage.getItem(BEST_KEY),
        10
      ) || 0;

  }catch(e){

    best = 0;

  }

  bestEl.textContent =
    best;


  /* ========================================================
     DIFICULTAD
  ======================================================== */

  function difficulty(){

    /*
      Una fase cada ~32 notas.

      0 = introducción
      1 = fácil
      2 = medio
      3 = difícil
      4 = muy difícil
      5 = máximo
    */

    return Math.min(
      5,
      Math.floor(
        producedEvents / 32
      )
    );

  }


  function bpm(){

    const d =
      difficulty();

    return Math.min(
      MAX_BPM,
      START_BPM + d * 5.5
    );

  }


  function beatDuration(){

    return (
      60000 /
      bpm()
    );

  }


  /* ========================================================
     PATRONES
  ======================================================== */

  /*
    No usamos puro random.

    Son pequeñas frases de 4 tiempos que
    dan una sensación mucho más musical.
  */

  const MOTIFS = [

    [0,1,2,1],

    [1,0,1,2],

    [2,1,0,1],

    [0,2,1,2],

    [1,2,1,0],

    [2,0,1,0]

  ];


  function chooseMotif(){

    const d =
      difficulty();

    /*
      Conforme aumenta la dificultad,
      damos algo más de peso a patrones
      menos previsibles.
    */

    let index =
      Math.floor(
        Math.random() *
        MOTIFS.length
      );

    if(
      d >= 3 &&
      Math.random() < .35
    ){

      index =
        Math.floor(
          Math.random() *
          MOTIFS.length
        );

    }

    return [
      ...MOTIFS[index]
    ];

  }


  /* ========================================================
     GENERACIÓN DE COMPASE
  ======================================================== */

  function generateMeasure(){

    const d =
      difficulty();

    const beat =
      beatDuration();

    const motif =
      chooseMotif();


    /*
      De vez en cuando invertimos la dirección.
    */

    if(
      Math.random() <
      .18 + d * .025
    ){

      motif.reverse();

    }


    /*
      A partir de dificultad media,
      puede haber un pequeño cambio de
      ritmo dentro del compás.
    */

    const addOffbeat =
      d >= 2 &&
      Math.random() <
      (
        .16 +
        (d - 2) * .08
      );


    /*
      ¿Habrá una doble?
    */

    const addDouble =
      d >= 1 &&
      Math.random() <
      (
        .08 +
        d * .035
      );


    for(
      let i = 0;
      i < BEATS_PER_MEASURE;
      i++
    ){

      const target =
        nextMeasureTime +
        i * beat;


      let lane =
        motif[i];


      /*
        Evita demasiadas repeticiones
        consecutivas del mismo carril.
      */

      if(
        lane === lastLane &&
        Math.random() < .35
      ){

        lane =
          (
            lane +
            (
              Math.random() < .5
                ? 1
                : 2
            )
          ) % 3;

      }


      /*
        Doble nota.

        No la ponemos en el primer beat
        y evitamos que coincida con un
        offbeat difícil.
      */

      const isDouble =
        addDouble &&
        i >= 1 &&
        i === 2;


      if(isDouble){

        let other;

        do{

          other =
            Math.floor(
              Math.random() * 3
            );

        }while(
          other === lane
        );


        spawnNoteGroup(
          [lane,other],
          target
        );


        lastLane =
          lane;


      }else{

        spawnNoteGroup(
          [lane],
          target
        );


        lastLane =
          lane;

      }


      /*
        Nota a contratiempo.

        Solo aparece en fases medias/altas.
        No se añade todos los compases.
      */

      if(
        addOffbeat &&
        i === 1
      ){

        let offLane;

        if(
          Math.random() < .55
        ){

          offLane =
            (lane + 1) % 3;

        }else{

          offLane =
            (lane + 2) % 3;

        }


        spawnNoteGroup(
          [offLane],
          target + beat * .5
        );

      }

    }


    nextMeasureTime +=
      BEATS_PER_MEASURE *
      beat;

    measureIndex++;

  }


  /* ========================================================
     SPAWN
  ======================================================== */

  function spawnNoteGroup(
    laneIndexes,
    targetTime
  ){

    laneIndexes.forEach(
      laneIndex => {

        const el =
          document.createElement(
            'div'
          );


        el.className =
          'note ' +
          ['a','b','c','d'][
            laneIndex % 4
          ];


        el.style.left =
          (
            laneIndex *
            100 /
            3
          ) + '%';


        board.appendChild(el);


        notes.push({

          el,

          lane:
            laneIndex,

          targetTime,

          hit:false,

          missed:false

        });

      }
    );


    producedEvents++;

  }


  function spawnUntil(now){

    /*
      Mantenemos siempre un tramo de notas
      ya preparado fuera de la pantalla.
    */

    while(
      nextMeasureTime -
      now <=
      TRAVEL
    ){

      generateMeasure();

    }

  }


  /* ========================================================
     POSICIÓN
  ======================================================== */

  function noteY(
    note,
    now
  ){

    const h =
      board.getBoundingClientRect()
        .height;


    const hitY =
      h * HIT_Y_RATIO;


    const startY =
      -72;


    const progress =
      1 -
      (
        note.targetTime -
        now
      ) /
      TRAVEL;


    return (
      startY +
      (
        hitY -
        startY
      ) *
      progress
    );

  }


  /* ========================================================
     AUDIO
  ======================================================== */

  function initAudio(){

    try{

      if(!audioCtx){

        audioCtx =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }


      if(
        audioCtx.state ===
        'suspended'
      ){

        audioCtx.resume();

      }

    }catch(e){}

  }


  function tone(
    frequency,
    duration=.06,
    type='square',
    volume=.025
  ){

    if(!audioCtx){
      return;
    }


    try{

      const now =
        audioCtx.currentTime;


      const osc =
        audioCtx.createOscillator();

      const gain =
        audioCtx.createGain();


      osc.type =
        type;


      osc.frequency.setValueAtTime(
        frequency,
        now
      );


      gain.gain.setValueAtTime(
        volume,
        now
      );


      gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + duration
      );


      osc.connect(gain);

      gain.connect(
        audioCtx.destination
      );


      osc.start(now);

      osc.stop(
        now + duration
      );

    }catch(e){}

  }


  /* ========================================================
     FEEDBACK
  ======================================================== */

  function feedback(
    text,
    type
  ){

    feedbackEl.textContent =
      text;

    feedbackEl.className =
      '';

    void feedbackEl.offsetWidth;

    feedbackEl.className =
      'show ' +
      type;

  }


  /* ========================================================
     VIDAS
  ======================================================== */

  function updateLives(){

    lifeEls.forEach(
      (life,index) => {

        life.classList.toggle(
          'lost',
          index >= lives
        );

      }
    );

  }


  function loseLife(){

    if(!running){
      return;
    }


    lives--;

    updateLives();


    combo = 0;

    comboEl.textContent =
      '0';

    comboDisplay.textContent =
      '';


    feedback(
      lives > 0
        ? 'FALLO'
        : 'GAME OVER',
      'bad'
    );


    tone(
      160,
      .14,
      'sawtooth',
      .025
    );


    board.classList.remove(
      'miss'
    );

    void board.offsetWidth;

    board.classList.add(
      'miss'
    );


    if(
      window.Companion &&
      typeof Companion.play ===
      'function'
    ){

      try{

        Companion.play(
          lives > 0
            ? 'sad'
            : 'sleep'
        );

      }catch(e){}

    }


    if(lives <= 0){

      setTimeout(
        finishGame,
        260
      );

    }

  }


  /* ========================================================
     HIT
  ======================================================== */

  function hitNote(
    note,
    delta
  ){

    if(
      note.hit ||
      note.missed
    ){

      return;

    }


    note.hit = true;


    const perfect =
      delta <= 60;


    const good =
      delta <= 115;


    if(perfect){

      score += 30;

      feedback(
        'PERFECT',
        'perfect'
      );

      tone(
        880,
        .075,
        'square',
        .03
      );


    }else if(good){

      score += 20;

      feedback(
        'BIEN',
        'good'
      );

      tone(
        660,
        .065,
        'square',
        .024
      );


    }else{

      score += 10;

      feedback(
        'OK',
        'good'
      );

      tone(
        520,
        .05,
        'square',
        .02
      );

    }


    combo++;


    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    /*
      Bonus de combo.

      Lo hacemos algo más generoso
      para que sobrevivir tenga recompensa.
    */

    if(
      combo >= 5
    ){

      score +=
        Math.min(
          20,
          Math.floor(
            combo / 5
          ) * 2
        );

    }


    scoreEl.textContent =
      score;


    comboEl.textContent =
      combo;


    comboDisplay.textContent =
      combo >= 2
        ? combo + '× COMBO'
        : '';


    comboDisplay.classList.remove(
      'pop'
    );

    void comboDisplay.offsetWidth;

    if(
      combo >= 2
    ){

      comboDisplay.classList.add(
        'pop'
      );

    }


    if(
      score >
      best
    ){

      best =
        score;

      bestEl.textContent =
        best;

      bestEl.classList.remove(
        'pop'
      );

      void bestEl.offsetWidth;

      bestEl.classList.add(
        'pop'
      );


      try{

        sessionStorage.setItem(
          BEST_KEY,
          String(best)
        );

      }catch(e){}

    }


    /*
      Animación simple de desaparición.
    */

    note.el.style.opacity =
      '0';

    note.el.style.transform =
      'translateY(' +
      noteY(
        note,
        performance.now()
      ) +
      'px) scale(1.12)';


    setTimeout(
      () => {

        if(
          note.el.parentNode
        ){

          note.el.remove();

        }

      },
      90
    );


    if(
      window.Companion &&
      typeof Companion.play ===
      'function'
    ){

      try{

        Companion.play(
          perfect
            ? 'cheer'
            : 'wave'
        );

      }catch(e){}

    }

  }


  /* ========================================================
     TOQUE
  ======================================================== */

  function tapLane(
    laneIndex
  ){

    if(!running){
      return;
    }


    const now =
      performance.now();


    let candidate =
      null;


    let bestDelta =
      Infinity;


    for(
      const note of notes
    ){

      if(
        note.hit ||
        note.missed ||
        note.lane !== laneIndex
      ){

        continue;

      }


      const delta =
        Math.abs(
          now -
          note.targetTime
        );


      if(
        delta <
        bestDelta
      ){

        bestDelta =
          delta;

        candidate =
          note;

      }

    }


    if(
      candidate &&
      bestDelta <=
      HIT_WINDOW
    ){

      hitNote(
        candidate,
        bestDelta
      );

    }

  }


  /* ========================================================
     TOUCH
  ======================================================== */

  lanes.forEach(
    (lane,index) => {

      lane.addEventListener(
        'pointerdown',
        event => {

          event.preventDefault();

          initAudio();

          tapLane(index);

        },
        {
          passive:false
        }
      );

    }
  );


  /* ========================================================
     TECLADO
  ======================================================== */

  document.addEventListener(
    'keydown',
    event => {

      if(event.repeat){
        return;
      }


      const key =
        event.key.toLowerCase();


      if(
        key === 'a' ||
        key === 's' ||
        key === 'd'
      ){

        event.preventDefault();

      }


      if(key === 'a'){
        tapLane(0);
      }

      if(key === 's'){
        tapLane(1);
      }

      if(key === 'd'){
        tapLane(2);
      }

    }
  );


  /* ========================================================
     UPDATE
  ======================================================== */

  function updateNotes(now){

    const h =
      board.getBoundingClientRect()
        .height;


    const hitY =
      h * HIT_Y_RATIO;


    const readyLanes =
      new Set();


    for(
      const note of notes
    ){

      if(
        note.hit ||
        note.missed
      ){

        continue;

      }


      const y =
        noteY(
          note,
          now
        );


      note.el.style.transform =
        'translateY(' +
        y +
        'px)';


      const center =
        y + 26;


      const near =
        Math.abs(
          center -
          hitY
        ) < 55;


      note.el.classList.toggle(
        'near-hit',
        near
      );


      if(near){

        readyLanes.add(
          note.lane
        );

      }


      /*
        La nota ha pasado.
      */

      if(
        now -
        note.targetTime >
        HIT_WINDOW
      ){

        missNote(
          note
        );

      }

    }


    lanes.forEach(
      (lane,index) => {

        lane.classList.toggle(
          'ready',
          readyLanes.has(index)
        );

      }
    );


    hitZone.classList.toggle(
      'ready',
      readyLanes.size > 0
    );


    removeOldNotes();

  }


  /* ========================================================
     MISS
  ======================================================== */

  function missNote(note){

    if(
      note.hit ||
      note.missed
    ){

      return;

    }


    note.missed =
      true;


    loseLife();


    note.el.style.opacity =
      '0';


    setTimeout(
      () => {

        if(
          note.el.parentNode
        ){

          note.el.remove();

        }

      },
      80
    );

  }


  /* ========================================================
     LIMPIEZA
  ======================================================== */

  function removeOldNotes(){

    notes =
      notes.filter(
        note =>
          !(
            note.hit ||
            note.missed
          )
      );

  }


  /* ========================================================
     LOOP
  ======================================================== */

  function loop(now){

    if(!running){
      return;
    }


    spawnUntil(now);

    updateNotes(now);


    if(
      running &&
      lives > 0
    ){

      raf =
        requestAnimationFrame(
          loop
        );

    }

  }


  /* ========================================================
     COUNTDOWN
  ======================================================== */

  function countdown(){

    return new Promise(
      resolve => {

        const values =
          [
            '3',
            '2',
            '1',
            '¡YA!'
          ];


        let index = 0;


        function next(){

          if(
            index >=
            values.length
          ){

            countdownEl.className =
              '';

            resolve();

            return;

          }


          countdownEl.textContent =
            values[index];


          countdownEl.className =
            'show';


          void countdownEl.offsetWidth;


          index++;


          setTimeout(
            next,
            index ===
              values.length
              ? 450
              : 680
          );

        }


        next();

      }
    );

  }


  /* ========================================================
     START
  ======================================================== */

  async function startGame(){

    initAudio();


    cancelAnimationFrame(
      raf
    );


    notes.forEach(
      note => {

        if(
          note.el.parentNode
        ){

          note.el.remove();

        }

      }
    );


    notes = [];


    score = 0;

    combo = 0;

    maxCombo = 0;

    lives = MAX_LIVES;

    measureIndex = 0;

    producedEvents = 0;

    lastLane = 1;


    scoreEl.textContent =
      '0';

    comboEl.textContent =
      '0';

    comboDisplay.textContent =
      '';


    updateLives();


    lanes.forEach(
      lane =>
        lane.classList.remove(
          'ready'
        )
    );


    hitZone.classList.remove(
      'ready'
    );


    overlay.classList.add(
      'hidden'
    );


    running = false;


    await countdown();


    const now =
      performance.now();


    nextMeasureTime =
      now +
      START_DELAY;


    running = true;


    raf =
      requestAnimationFrame(
        loop
      );

  }


  /* ========================================================
     GAME OVER
  ======================================================== */

  function finishGame(){

    if(!running){
      return;
    }


    running = false;


    cancelAnimationFrame(
      raf
    );


    lanes.forEach(
      lane =>
        lane.classList.remove(
          'ready'
        )
    );


    hitZone.classList.remove(
      'ready'
    );


    notes.forEach(
      note => {

        if(
          note.el.parentNode
        ){

          note.el.remove();

        }

      }
    );


    notes = [];


    const isRecord =
      score === best &&
      score > 0;


    overlay.innerHTML = `

      <h2>
        GAME OVER
      </h2>

      <div id="overlay-score">
        ${score} PUNTOS
        <br>
        <span style="color:var(--dim)">
          COMBO MÁXIMO: ${maxCombo}
        </span>
      </div>

      ${
        isRecord
          ? `
            <div style="
              color:var(--c3);
              font-size:9px;
            ">
              ★ NUEVO RÉCORD ★
            </div>
          `
          : ''
      }

      <button id="again-btn">
        JUGAR OTRA VEZ
      </button>

    `;


    overlay.classList.remove(
      'hidden'
    );


    document
      .getElementById(
        'again-btn'
      )
      .addEventListener(
        'click',
        startGame
      );


    if(
      window.Companion &&
      typeof Companion.play ===
      'function'
    ){

      try{

        Companion.play(
          isRecord
            ? 'cheer'
            : 'sad'
        );

      }catch(e){}

    }

  }


  /* ========================================================
     INICIO
  ======================================================== */

  startBtn.addEventListener(
    'click',
    startGame
  );


})();
</script>

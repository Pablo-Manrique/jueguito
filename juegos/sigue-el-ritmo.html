<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sigue el Ritmo · Mini Arcade</title>

<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">

<link rel="stylesheet" href="../assets/companion.css">

<style>
:root{
  --bg:#08090d;
  --panel:#11131a;
  --text:#f4f5f7;
  --muted:#858995;

  --c1:#ff5f56;
  --c2:#ffd166;
  --c3:#66e3ff;
  --c4:#a78bfa;

  --good:#7dff9b;
  --bad:#ff6b7a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

button{
  font:inherit;
}

#app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  padding:18px 14px 28px;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.back{
  text-decoration:none;
  color:var(--muted);
  font-size:14px;
  padding:8px 0;
}

.back:hover{
  color:var(--text);
}

.title-wrap{
  flex:1;
  text-align:center;
}

h1{
  margin:0;
  font-size:21px;
  letter-spacing:.08em;
  font-weight:800;
}

.subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.best{
  min-width:65px;
  text-align:right;
  color:var(--muted);
  font-size:11px;
  line-height:1.25;
}

.best strong{
  display:block;
  color:var(--text);
  font-size:17px;
}

/* =========================================================
   INFO
========================================================= */

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 auto 10px;
  width:100%;
  max-width:390px;
  color:var(--muted);
  font-size:12px;
}

.info strong{
  color:var(--text);
}

#score{
  font-size:15px;
}

#combo{
  position:absolute;
  left:50%;
  bottom:7%;
  transform:translateX(-50%);
  z-index:8;

  min-width:100px;
  text-align:center;

  font-size:18px;
  font-weight:800;
  letter-spacing:.05em;

  text-shadow:0 0 12px rgba(255,255,255,.2);

  pointer-events:none;
}

#combo.hot{
  animation:comboPop .18s ease-out;
}

@keyframes comboPop{
  0%{transform:translateX(-50%) scale(.8);opacity:.4}
  100%{transform:translateX(-50%) scale(1);opacity:1}
}

/* =========================================================
   GAME BOARD
========================================================= */

#play{
  position:relative;

  width:100%;
  max-width:390px;

  aspect-ratio:.68;

  margin:0 auto;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;

  background:
    radial-gradient(circle at 50% 100%,
      rgba(255,255,255,.055),
      transparent 45%),
    linear-gradient(
      180deg,
      rgba(255,255,255,.018),
      rgba(255,255,255,.008)
    );

  box-shadow:
    0 18px 60px rgba(0,0,0,.35),
    inset 0 0 30px rgba(255,255,255,.015);

  touch-action:none;
  user-select:none;
}

/* =========================================================
   LANES
========================================================= */

#lanes{
  position:absolute;
  inset:0;

  display:grid;
  grid-template-columns:repeat(3,1fr);
}

.lane{
  position:relative;

  border-right:1px solid rgba(255,255,255,.075);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.008),
      rgba(255,255,255,.018)
    );

  transition:
    background .08s ease,
    box-shadow .08s ease;
}

.lane:last-child{
  border-right:none;
}

.lane::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:0;

  width:1px;
  height:100%;

  transform:translateX(-50%);

  background:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(255,255,255,.025) 55%,
    rgba(255,255,255,.08) 100%
  );

  pointer-events:none;
}

/* Carril preparado para recibir nota */

.lane.ready{
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.012),
      rgba(255,255,255,.07)
    );

  box-shadow:
    inset 0 -70px 60px rgba(255,255,255,.055);
}

.lane-key{
  position:absolute;

  left:50%;
  bottom:10px;

  transform:translateX(-50%);

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;

  color:rgba(255,255,255,.35);

  font-size:13px;
  font-weight:800;

  background:rgba(255,255,255,.025);

  transition:
    color .08s ease,
    border-color .08s ease,
    background .08s ease,
    transform .08s ease;
}

.lane.ready .lane-key{
  color:rgba(255,255,255,.85);
  border-color:rgba(255,255,255,.3);
  background:rgba(255,255,255,.09);

  transform:translateX(-50%) scale(1.05);
}

/* =========================================================
   HIT ZONE
========================================================= */

/*
   La zona de golpe está bastante más arriba que antes.
   No es necesario tocar exactamente la línea:
   toda esta franja cuenta como referencia visual.
*/

#hit-zone{
  position:absolute;

  left:0;
  right:0;

  bottom:25%;

  height:82px;

  border-top:2px solid var(--c3);
  border-bottom:2px solid rgba(102,227,255,.35);

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.025),
      rgba(255,255,255,.07),
      rgba(255,255,255,.025)
    );

  box-shadow:
    0 -1px 12px rgba(102,227,255,.06),
    0 1px 10px rgba(102,227,255,.03);

  pointer-events:none;
  z-index:3;

  transition:
    background .08s ease,
    box-shadow .08s ease,
    border-color .08s ease;
}

#hit-zone.ready{
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.045),
      rgba(255,255,255,.13),
      rgba(255,255,255,.045)
    );

  border-top-color:rgba(102,227,255,.95);

  box-shadow:
    0 -2px 20px rgba(102,227,255,.14),
    0 2px 15px rgba(102,227,255,.07);
}

/* Línea central de pulso */

#beat-pulse{
  position:absolute;

  left:0;
  right:0;

  bottom:calc(25% + 41px);

  height:2px;

  background:rgba(255,255,255,.28);

  box-shadow:
    0 0 8px rgba(255,255,255,.08);

  pointer-events:none;
  z-index:4;

  opacity:.65;

  transition:
    opacity .08s ease,
    transform .08s ease;
}

#hit-zone.ready + #beat-pulse{
  opacity:1;
}

/* =========================================================
   NOTES
========================================================= */

.note{
  position:absolute;

  top:0;

  width:33.3333%;
  height:54px;

  border-radius:12px;

  transform:translateY(-90px);

  z-index:5;

  box-shadow:
    0 6px 20px rgba(0,0,0,.25);

  transition:
    filter .06s ease,
    opacity .08s ease;
}

.note::after{
  content:"";

  position:absolute;
  inset:5px;

  border:1px solid rgba(255,255,255,.28);
  border-radius:8px;

  pointer-events:none;
}

.note.a{
  background:
    linear-gradient(
      180deg,
      rgba(255,95,86,.95),
      rgba(255,95,86,.65)
    );
}

.note.b{
  background:
    linear-gradient(
      180deg,
      rgba(255,209,102,.95),
      rgba(255,209,102,.65)
    );
}

.note.c{
  background:
    linear-gradient(
      180deg,
      rgba(102,227,255,.95),
      rgba(102,227,255,.65)
    );
}

.note.d{
  background:
    linear-gradient(
      180deg,
      rgba(167,139,250,.95),
      rgba(167,139,250,.65)
    );
}

.note.near-hit{
  filter:
    brightness(1.25)
    drop-shadow(0 0 12px rgba(255,255,255,.22));

  transform:
    translateY(var(--note-y))
    scale(1.025);
}

/* =========================================================
   FEEDBACK
========================================================= */

#feedback{
  position:absolute;

  left:50%;
  top:41%;

  transform:translate(-50%,-50%);

  z-index:10;

  pointer-events:none;

  font-size:17px;
  font-weight:900;

  letter-spacing:.08em;

  opacity:0;

  white-space:nowrap;

  text-shadow:0 0 14px rgba(255,255,255,.18);
}

#feedback.show{
  animation:feedback .42s ease-out forwards;
}

#feedback.good{
  color:var(--good);
}

#feedback.perfect{
  color:var(--c3);
}

#feedback.bad{
  color:var(--bad);
}

@keyframes feedback{
  0%{
    opacity:0;
    transform:translate(-50%,-40%) scale(.8);
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:translate(-50%,-90%) scale(1.05);
  }
}

/* =========================================================
   COUNTDOWN
========================================================= */

#countdown{
  position:absolute;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:20;

  font-size:58px;
  font-weight:900;

  pointer-events:none;

  text-shadow:
    0 0 30px rgba(255,255,255,.18);

  opacity:0;
}

#countdown.show{
  animation:countdown .72s ease-out forwards;
}

@keyframes countdown{
  0%{
    opacity:0;
    transform:scale(1.35);
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:scale(.9);
  }
}

/* =========================================================
   OVERLAY
========================================================= */

#overlay{
  position:absolute;

  inset:0;

  z-index:30;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:30px;

  text-align:center;

  background:
    radial-gradient(
      circle at center,
      rgba(8,9,13,.72),
      rgba(8,9,13,.96)
    );

  backdrop-filter:blur(4px);
}

#overlay.hidden{
  display:none;
}

.overlay-title{
  font-size:25px;
  font-weight:900;

  letter-spacing:.08em;

  margin-bottom:8px;
}

.overlay-text{
  max-width:280px;

  color:var(--muted);

  font-size:13px;
  line-height:1.5;

  margin-bottom:22px;
}

#start-btn,
#again-btn{
  border:1px solid rgba(255,255,255,.18);

  border-radius:12px;

  padding:12px 24px;

  color:var(--text);

  background:rgba(255,255,255,.07);

  cursor:pointer;

  font-weight:800;

  letter-spacing:.04em;

  transition:
    transform .12s ease,
    background .12s ease,
    border-color .12s ease;
}

#start-btn:hover,
#again-btn:hover{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.3);
}

#start-btn:active,
#again-btn:active{
  transform:scale(.96);
}

.result{
  margin:0 0 4px;

  font-size:13px;
  color:var(--muted);
}

.result strong{
  color:var(--text);
  font-size:28px;
}

.new-record{
  color:var(--good);
  font-size:12px;
  font-weight:800;
  margin:6px 0 18px;
}

/* =========================================================
   BOTTOM HELP
========================================================= */

.help{
  width:100%;
  max-width:390px;

  margin:12px auto 0;

  text-align:center;

  color:var(--muted);

  font-size:11px;
  line-height:1.5;
}

.help strong{
  color:rgba(255,255,255,.65);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-height:700px){
  #app{
    padding-top:10px;
  }

  .top{
    margin-bottom:8px;
  }

  .info{
    margin-bottom:6px;
  }

  .help{
    margin-top:7px;
  }
}

@media (min-width:600px){
  #app{
    padding-top:28px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="top">

    <a class="back" href="../index.html">
      ← Arcade
    </a>

    <div class="title-wrap">
      <h1>SIGUE EL RITMO</h1>
      <div class="subtitle">Toca las notas al llegar</div>
    </div>

    <div class="best">
      RÉCORD
      <strong id="best">0</strong>
    </div>

  </div>

  <div class="info">
    <div>
      PUNTOS <strong id="score">0</strong>
    </div>

    <div>
      COMBO <strong id="combo-top">0</strong>
    </div>
  </div>

  <div id="play">

    <div id="lanes">

      <div class="lane" data-lane="0">
        <span class="lane-key">A</span>
      </div>

      <div class="lane" data-lane="1">
        <span class="lane-key">S</span>
      </div>

      <div class="lane" data-lane="2">
        <span class="lane-key">D</span>
      </div>

    </div>

    <div id="hit-zone"></div>

    <div id="beat-pulse"></div>

    <div id="feedback"></div>

    <div id="combo"></div>

    <div id="countdown"></div>

    <div id="overlay">

      <div class="overlay-title">
        SIGUE EL RITMO
      </div>

      <div class="overlay-text">
        Toca el carril cuando la nota llegue a la zona iluminada.
        No necesitas pulsar exactamente sobre la línea.
      </div>

      <button id="start-btn">
        EMPEZAR
      </button>

    </div>

  </div>

  <div class="help">
    <strong>Móvil:</strong> toca cualquier punto del carril ·
    <strong>PC:</strong> A · S · D
  </div>

</div>

<script src="../assets/companion.js"></script>

<script>
(() => {

  /* ========================================================
     CONFIGURACIÓN
  ======================================================== */

  const KEY = 'miniArcade.ritmo.best';

  const BPM = 108;
  const BEAT = 60000 / BPM;

  const TOTAL_BEATS = 72;

  /*
    Tiempo que tarda una nota desde que aparece
    hasta llegar a la zona de golpe.
  */
  const TRAVEL = 1850;

  /*
    Ventana de acierto.
    140 ms permite jugar cómodamente en móvil
    sin hacer que el juego sea demasiado fácil.
  */
  const HIT_WINDOW = 150;

  /*
    Zona de golpe.

    Antes estaba alrededor del 76%.
    Ahora está más arriba para que resulte mucho
    más natural visualmente.
  */
  const HIT_Y_RATIO = .68;

  const START_DELAY = 1150;

  /* ========================================================
     ELEMENTOS
  ======================================================== */

  const play = document.getElementById('play');

  const lanes = [...document.querySelectorAll('.lane')];

  const overlay = document.getElementById('overlay');

  const startBtn = document.getElementById('start-btn');

  const scoreEl = document.getElementById('score');

  const comboTopEl = document.getElementById('combo-top');

  const comboEl = document.getElementById('combo');

  const bestEl = document.getElementById('best');

  const feedbackEl = document.getElementById('feedback');

  const countdownEl = document.getElementById('countdown');

  const hitZone = document.getElementById('hit-zone');

  /* ========================================================
     ESTADO
  ======================================================== */

  let best = 0;

  let score = 0;

  let combo = 0;

  let maxCombo = 0;

  let beatIndex = 0;

  let startTime = 0;

  let running = false;

  let animationFrame = 0;

  let notes = [];

  let pattern = [];

  let lastBeat = -1;

  /* ========================================================
     RÉCORD
  ======================================================== */

  try{
    best = parseInt(
      sessionStorage.getItem(KEY),
      10
    ) || 0;
  }catch(e){
    best = 0;
  }

  bestEl.textContent = best;

  /* ========================================================
     BLIP
  ======================================================== */

  let blip = null;

  try{
    if(window.Companion){
      blip = Companion.mount(
        document.createElement('div'),
        {
          size:34
        }
      );
    }
  }catch(e){
    blip = null;
  }

  function blipPlay(gesture){

    try{
      if(
        window.Companion &&
        typeof Companion.play === 'function'
      ){
        Companion.play(gesture);
      }
    }catch(e){}

  }

  /* ========================================================
     AUDIO
  ======================================================== */

  let audioCtx = null;

  function initAudio(){

    try{

      if(!audioCtx){

        audioCtx =
          new (window.AudioContext ||
          window.webkitAudioContext)();

      }

      if(audioCtx.state === 'suspended'){
        audioCtx.resume();
      }

    }catch(e){}

  }

  function tone(
    frequency,
    duration=.06,
    type='sine',
    volume=.025
  ){

    if(!audioCtx) return;

    try{

      const now = audioCtx.currentTime;

      const oscillator =
        audioCtx.createOscillator();

      const gain =
        audioCtx.createGain();

      oscillator.type = type;

      oscillator.frequency.setValueAtTime(
        frequency,
        now
      );

      gain.gain.setValueAtTime(
        volume,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + duration
      );

      oscillator.connect(gain);

      gain.connect(audioCtx.destination);

      oscillator.start(now);

      oscillator.stop(now + duration);

    }catch(e){}

  }

  /* ========================================================
     PATRÓN
  ======================================================== */

  function makePattern(){

    const p = [];

    let lastLane = 1;

    for(
      let i = 0;
      i < TOTAL_BEATS;
      i++
    ){

      const r = Math.random();

      /*
        Primeros compases:
        patrón sencillo para que el jugador
        entre en ritmo.
      */

      if(i < 4){

        lastLane =
          (lastLane + 1) % 3;

        p.push(lastLane);

        continue;
      }

      /*
        A partir de aquí aparecen ocasionalmente
        notas dobles.
      */

      const doubleChance =
        i < 16
          ? .15
          : i < 40
            ? .22
            : .30;

      if(
        i % 8 === 6 &&
        r < doubleChance
      ){

        const other =
          (lastLane +
            1 +
            Math.floor(
              Math.random() * 2
            )) % 3;

        p.push(
          8 +
          (lastLane << 2) +
          other
        );

        continue;
      }

      let lane;

      /*
        Mantener ocasionalmente el mismo carril
        evita que el juego se convierta simplemente
        en "izquierda-derecha-izquierda-derecha".
      */

      if(r < .38){

        lane = lastLane;

      }else if(r < .70){

        lane =
          (lastLane + 1) % 3;

      }else{

        lane =
          (lastLane + 2) % 3;

      }

      /*
        Cambio de carril periódico para mantener
        sensación musical.
      */

      if(
        i % 8 === 0 &&
        r < .72
      ){

        lane =
          (lastLane + 1) % 3;

      }

      lastLane = lane;

      p.push(lane + 1);

    }

    return p;

  }

  /* ========================================================
     SPAWN
  ======================================================== */

  function spawnNote(
    laneIndex,
    targetTime
  ){

    const el =
      document.createElement('div');

    el.className =
      'note ' +
      ['a','b','c','d'][
        laneIndex % 4
      ];

    el.style.left =
      (laneIndex * 100 / 3) + '%';

    el.dataset.lane =
      laneIndex;

    play.appendChild(el);

    notes.push({

      el,

      lane:laneIndex,

      targetTime,

      hit:false,

      missed:false

    });

  }

  /* ========================================================
     POSICIÓN
  ======================================================== */

  function noteY(
    note,
    now
  ){

    const h =
      play.getBoundingClientRect().height;

    const hitY =
      h * HIT_Y_RATIO;

    const startY = -90;

    const progress =
      1 -
      (note.targetTime - now) /
      TRAVEL;

    return (
      startY +
      (hitY - startY) *
      progress
    );

  }

  /* ========================================================
     FEEDBACK
  ======================================================== */

  function feedback(
    text,
    type
  ){

    feedbackEl.textContent =
      text;

    feedbackEl.className =
      '';

    /*
      Forzar reflow para que la animación
      pueda repetirse rápidamente.
    */

    void feedbackEl.offsetWidth;

    feedbackEl.className =
      'show ' + type;

  }

  /* ========================================================
     HIT
  ======================================================== */

  function hitNote(
    note,
    delta
  ){

    if(note.hit || note.missed){
      return;
    }

    note.hit = true;

    /*
      Cuanto más cerca del momento exacto,
      mayor recompensa.
    */

    const perfect =
      delta <= 65;

    const good =
      delta <= 115;

    if(perfect){

      score += 30;

      feedback(
        'PERFECT',
        'perfect'
      );

      tone(
        880,
        .08,
        'sine',
        .035
      );

    }else if(good){

      score += 20;

      feedback(
        'BIEN',
        'good'
      );

      tone(
        660,
        .07,
        'sine',
        .028
      );

    }else{

      score += 10;

      feedback(
        'OK',
        'good'
      );

      tone(
        520,
        .06,
        'sine',
        .024
      );

    }

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );

    /*
      Bonus progresivo por combo.
    */

    if(combo >= 5){

      score +=
        Math.min(
          15,
          Math.floor(combo / 5) * 2
        );

    }

    scoreEl.textContent =
      score;

    comboTopEl.textContent =
      combo;

    comboEl.textContent =
      combo >= 2
        ? combo + '× COMBO'
        : '';

    comboEl.classList.remove(
      'hot'
    );

    void comboEl.offsetWidth;

    if(combo >= 2){

      comboEl.classList.add(
        'hot'
      );

    }

    note.el.style.opacity =
      '0';

    note.el.style.transform =
      'translateY(' +
      noteY(
        note,
        performance.now()
      ) +
      'px) scale(1.18)';

    setTimeout(() => {

      if(note.el.parentNode){

        note.el.remove();

      }

    },120);

    if(perfect){

      blipPlay('cheer');

    }else{

      blipPlay('wave');

    }

  }

  /* ========================================================
     MISS
  ======================================================== */

  function missNote(note){

    if(note.hit || note.missed){
      return;
    }

    note.missed = true;

    combo = 0;

    comboTopEl.textContent =
      combo;

    comboEl.textContent =
      '';

    feedback(
      'FALLO',
      'bad'
    );

    tone(
      180,
      .09,
      'sawtooth',
      .018
    );

    blipPlay('sad');

    note.el.style.opacity =
      '0';

    setTimeout(() => {

      if(note.el.parentNode){

        note.el.remove();

      }

    },100);

  }

  /* ========================================================
     INPUT
  ======================================================== */

  function tapLane(
    laneIndex
  ){

    if(!running){
      return;
    }

    const now =
      performance.now();

    let candidate = null;

    let bestDelta =
      Infinity;

    for(const note of notes){

      if(
        note.hit ||
        note.missed ||
        note.lane !== laneIndex
      ){
        continue;
      }

      const delta =
        Math.abs(
          now -
          note.targetTime
        );

      if(
        delta < bestDelta
      ){

        bestDelta =
          delta;

        candidate =
          note;

      }

    }

    if(
      candidate &&
      bestDelta <= HIT_WINDOW
    ){

      hitNote(
        candidate,
        bestDelta
      );

    }else{

      /*
        Pulsar demasiado pronto no rompe
        el combo. Solo se ignora.
        Esto evita castigar toques accidentales.
      */

      const closest =
        notes
          .filter(n =>
            !n.hit &&
            !n.missed &&
            n.lane === laneIndex
          )
          .sort(
            (a,b) =>
              Math.abs(
                a.targetTime - now
              ) -
              Math.abs(
                b.targetTime - now
              )
          )[0];

      if(
        closest &&
        closest.targetTime < now - HIT_WINDOW
      ){

        missNote(
          closest
        );

      }

    }

  }

  /* ========================================================
     POINTER
  ======================================================== */

  lanes.forEach(
    (lane,index) => {

      lane.addEventListener(
        'pointerdown',
        event => {

          event.preventDefault();

          initAudio();

          tapLane(index);

        },
        {
          passive:false
        }
      );

    }
  );

  /* ========================================================
     TECLADO
  ======================================================== */

  document.addEventListener(
    'keydown',
    event => {

      if(event.repeat){
        return;
      }

      const key =
        event.key.toLowerCase();

      if(key === 'a'){
        tapLane(0);
      }

      if(key === 's'){
        tapLane(1);
      }

      if(key === 'd'){
        tapLane(2);
      }

      if(
        key === 'a' ||
        key === 's' ||
        key === 'd'
      ){

        event.preventDefault();

      }

    }
  );

  /* ========================================================
     UPDATE
  ======================================================== */

  function updateNotes(now){

    const h =
      play.getBoundingClientRect().height;

    const hitY =
      h * HIT_Y_RATIO;

    const readyLanes =
      new Set();

    notes.forEach(
      note => {

        if(
          note.hit ||
          note.missed
        ){
          return;
        }

        const y =
          noteY(
            note,
            now
          );

        note.el.style.setProperty(
          '--note-y',
          y + 'px'
        );

        note.el.style.transform =
          'translateY(' +
          y +
          'px)';

        const center =
          y + 27;

        const near =
          Math.abs(
            center - hitY
          ) < 55;

        note.el.classList.toggle(
          'near-hit',
          near
        );

        if(near){

          readyLanes.add(
            note.lane
          );

        }

        /*
          Si la nota ya ha pasado suficientemente
          la zona de golpe, cuenta como fallo.
        */

        if(
          now -
          note.targetTime >
          HIT_WINDOW
        ){

          missNote(
            note
          );

        }

      }
    );

    lanes.forEach(
      (lane,index) => {

        lane.classList.toggle(
          'ready',
          readyLanes.has(index)
        );

      }
    );

    hitZone.classList.toggle(
      'ready',
      readyLanes.size > 0
    );

    removeOldNotes();

  }

  /* ========================================================
     LIMPIEZA
  ======================================================== */

  function removeOldNotes(){

    notes =
      notes.filter(
        note => {

          if(
            note.hit ||
            note.missed
          ){

            return false;

          }

          return true;

        }
      );

  }

  /* ========================================================
     SPAWN LOOP
  ======================================================== */

  function spawnUntil(now){

    while(
      beatIndex <
      pattern.length
    ){

      const targetTime =
        startTime +
        START_DELAY +
        beatIndex * BEAT;

      /*
        Crear la nota antes de que llegue
        a pantalla.
      */

      if(
        targetTime - now >
        TRAVEL
      ){

        break;

      }

      const value =
        pattern[beatIndex];

      if(
        value >= 8
      ){

        /*
          Decodificación de nota doble.
        */

        const packed =
          value - 8;

        const laneA =
          (packed >> 2) & 3;

        const laneB =
          packed & 3;

        spawnNote(
          laneA,
          targetTime
        );

        spawnNote(
          laneB,
          targetTime
        );

      }else{

        spawnNote(
          value - 1,
          targetTime
        );

      }

      beatIndex++;

    }

  }

  /* ========================================================
     LOOP PRINCIPAL
  ======================================================== */

  function loop(now){

    if(!running){
      return;
    }

    spawnUntil(now);

    updateNotes(now);

    /*
      Pulso visual en cada beat.
    */

    const elapsed =
      now -
      (
        startTime +
        START_DELAY
      );

    const currentBeat =
      Math.floor(
        elapsed / BEAT
      );

    if(
      currentBeat >= 0 &&
      currentBeat !== lastBeat
    ){

      lastBeat =
        currentBeat;

      beatPulse();

    }

    /*
      Fin de partida:
      esperamos a que termine el último beat
      y que desaparezcan las últimas notas.
    */

    const endTime =
      startTime +
      START_DELAY +
      TOTAL_BEATS * BEAT +
      TRAVEL +
      250;

    if(now >= endTime){

      finishGame();

      return;

    }

    animationFrame =
      requestAnimationFrame(
        loop
      );

  }

  /* ========================================================
     BEAT VISUAL
  ======================================================== */

  function beatPulse(){

    const pulse =
      document.getElementById(
        'beat-pulse'
      );

    pulse.style.transform =
      'scaleX(1.035)';

    setTimeout(
      () => {

        pulse.style.transform =
          'scaleX(1)';

      },
      70
    );

  }

  /* ========================================================
     COUNTDOWN
  ======================================================== */

  function countdown(){

    return new Promise(
      resolve => {

        const values =
          ['3','2','1','¡YA!'];

        let index = 0;

        function next(){

          if(
            index >=
            values.length
          ){

            countdownEl.className =
              '';

            resolve();

            return;

          }

          countdownEl.textContent =
            values[index];

          countdownEl.className =
            'show';

          void countdownEl.offsetWidth;

          index++;

          setTimeout(
            next,
            index === values.length
              ? 420
              : 700
          );

        }

        next();

      }
    );

  }

  /* ========================================================
     START
  ======================================================== */

  async function startGame(){

    initAudio();

    cancelAnimationFrame(
      animationFrame
    );

    notes.forEach(
      note => {

        if(note.el.parentNode){
          note.el.remove();
        }

      }
    );

    notes = [];

    score = 0;

    combo = 0;

    maxCombo = 0;

    beatIndex = 0;

    lastBeat = -1;

    pattern =
      makePattern();

    scoreEl.textContent =
      '0';

    comboTopEl.textContent =
      '0';

    comboEl.textContent =
      '';

    feedbackEl.className =
      '';

    lanes.forEach(
      lane =>
        lane.classList.remove(
          'ready'
        )
    );

    hitZone.classList.remove(
      'ready'
    );

    overlay.classList.add(
      'hidden'
    );

    running = false;

    await countdown();

    startTime =
      performance.now();

    running = true;

    animationFrame =
      requestAnimationFrame(
        loop
      );

  }

  /* ========================================================
     FIN
  ======================================================== */

  function finishGame(){

    if(!running){
      return;
    }

    running = false;

    cancelAnimationFrame(
      animationFrame
    );

    lanes.forEach(
      lane =>
        lane.classList.remove(
          'ready'
        )
    );

    hitZone.classList.remove(
      'ready'
    );

    notes.forEach(
      note => {

        if(note.el.parentNode){
          note.el.remove();
        }

      }
    );

    notes = [];

    let record = false;

    if(score > best){

      best = score;

      record = true;

      try{

        sessionStorage.setItem(
          KEY,
          String(best)
        );

      }catch(e){}

      bestEl.textContent =
        best;

      blipPlay('cheer');

    }else{

      blipPlay('wave');

    }

    showEndScreen(
      record
    );

  }

  /* ========================================================
     END SCREEN
  ======================================================== */

  function showEndScreen(
    record
  ){

    overlay.innerHTML = `

      <div class="overlay-title">
        FIN
      </div>

      <div class="result">
        PUNTUACIÓN
        <strong>${score}</strong>
      </div>

      <div class="result">
        COMBO MÁXIMO
        <strong>${maxCombo}</strong>
      </div>

      ${
        record
          ? `
            <div class="new-record">
              ★ NUEVO RÉCORD ★
            </div>
          `
          : `
            <div style="height:18px"></div>
          `
      }

      <button id="again-btn">
        JUGAR OTRA VEZ
      </button>

    `;

    overlay.classList.remove(
      'hidden'
    );

    document
      .getElementById('again-btn')
      .addEventListener(
        'click',
        startGame
      );

  }

  /* ========================================================
     START BUTTON
  ======================================================== */

  startBtn.addEventListener(
    'click',
    startGame
  );

})();
</script>

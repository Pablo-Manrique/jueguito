<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 · Mini Arcade</title><link rel="manifest" href="../manifest.json"><link rel="icon" href="../assets/favicon-48.png"><link rel="stylesheet" href="../assets/theme.css"><link rel="stylesheet" href="../assets/companion.css"><style>#app{width:min(94vw,430px);margin:auto}.top{display:flex;gap:6px;margin:8px 0}.box{flex:1;border:1px solid var(--grid);background:var(--panel);padding:7px;font-size:7px;color:var(--dim)}.box b{display:block;color:var(--ink);font-size:10px;margin-top:4px}.buttons{display:flex;gap:5px;margin-left:auto}.btn,.key{font:7px inherit;color:var(--dim);background:var(--panel);border:1px solid var(--grid);padding:8px}.intro,.note{font-size:7px;color:var(--dim);line-height:1.8}.intro{margin:4px 0 9px}.board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;background:var(--grid);aspect-ratio:1;box-shadow:4px 4px 0 #0005;touch-action:none}.cell{background:var(--panel)}.tile{position:absolute;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,6vw,24px);color:var(--ink)}.n2{background:var(--c2);color:var(--bg)}.n4{background:var(--c3);color:var(--bg)}.n8{background:var(--c1)}.n16{background:var(--c4)}.n32{background:#e98bff}.n64{background:#ff8a65}.n128{background:#ffd23f;color:var(--bg)}.n256{background:#3ddad7;color:var(--bg)}.n512{background:#9d7bff}.n1024{background:#ff5d73}.n2048{background:var(--ink);color:var(--bg);box-shadow:inset 0 0 0 3px var(--c3)}.msg{text-align:center;min-height:18px;color:var(--c3);font-size:7px;margin:8px}.keys{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:40px 40px;gap:5px;justify-content:center}.key{font-size:14px;color:var(--ink);padding:0}.up{grid-column:2}.left{grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.overlay{position:absolute;inset:0;background:#14121ff2;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay h2{color:var(--c3);font-size:12px}.overlay p{font-size:7px;color:var(--dim);line-height:1.9}.start{font:8px inherit;background:var(--c2);color:var(--bg);border:0;padding:12px 18px}</style></head><body><div class="top-nav"><a class="back-link" href="../index.html">← MENÚ</a><span class="page-title">2048</span></div><main id="app"><div class="top"><div class="box">PUNTOS<b id="score">0</b></div><div class="box">MEJOR<b id="best">0</b></div><div class="buttons"><button class="btn" id="undo">DESHACER</button><button class="btn" id="new">NUEVO</button></div></div><p class="intro">Desliza o usa las flechas. Las fichas iguales se combinan. Llega a <b>2048</b> y continúa si quieres.</p><div style="position:relative"><div class="board" id="board"></div><div class="overlay" id="overlay"><div><h2>2048</h2><p>Combina números iguales hasta llegar a 2048.</p><button class="start" id="start">EMPEZAR</button></div></div></div><div class="msg" id="msg"></div><div class="keys"><button class="key up" data-d="up">↑</button><button class="key left" data-d="left">←</button><button class="key down" data-d="down">↓</button><button class="key right" data-d="right">→</button></div><p class="note">swipe · flechas · botones · récord de sesión</p></main><script>(()=>{let b=Array.from({length:4},()=>Array(4).fill(0)),score=0,best=+(sessionStorage.getItem('miniArcade.2048.best')||0),hist=null,started=0,won=0,touch=null;const board=document.getElementById('board'),ov=document.getElementById('overlay'),msg=document.getElementById('msg');const empty=()=>{let a=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!b[r][c])a.push([r,c]);return a};const add=()=>{let a=empty();if(!a.length)return;let p=a[Math.random()*a.length|0];b[p[0]][p[1]]=Math.random()<.9?2:4};const render=()=>{board.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){let cell=document.createElement('div');cell.className='cell';let n=b[r][c];if(n){let t=document.createElement('div');t.className='tile n'+n;t.textContent=n;t.style.left='calc('+c+' * (25% - 5.25px) + 8px)';t.style.top='calc('+r+' * (25% - 5.25px) + 8px)';t.style.width='calc(25% - 5.25px)';t.style.height='calc(25% - 5.25px)';cell.appendChild(t)}board.appendChild(cell)}document.getElementById('score').textContent=score;document.getElementById('best').textContent=best};const line=a=>{a=a.filter(Boolean);let o=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){o.push(a[i]*2);score+=a[i]*2;i++}else o.push(a[i])}while(o.length<4)o.push(0);return o};const can=()=>{if(empty().length)return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(c<3&&b[r][c]===b[r][c+1]||r<3&&b[r][c]===b[r+1][c])return true;return false};function move(d){if(!started)return;let before=b.map(r=>r.slice()),s=score,n=Array.from({length:4},()=>Array(4).fill(0));if(d==='left')n=b.map(line);if(d==='right')n=b.map(a=>line(a.slice().reverse()).reverse());if(d==='up'||d==='down')for(let c=0;c<4;c++){let a=[];for(let r=0;r<4;r++)a.push(b[d==='up'?r:3-r][c]);a=line(a);for(let r=0;r<4;r++)n[d==='up'?r:3-r][c]=a[r]}if(JSON.stringify(n)===JSON.stringify(b))return;hist={b:before,s};b=n;add();if(score>best){best=score;sessionStorage.setItem('miniArcade.2048.best',best)}if(!won&&b.some(r=>r.includes(2048))){won=1;msg.textContent='🎉 2048 · puedes continuar'}else msg.textContent='';render();if(!can())msg.textContent='SIN MOVIMIENTOS · FIN';}function fresh(){b=Array.from({length:4},()=>Array(4).fill(0));score=0;hist=null;won=0;started=1;msg.textContent='';add();add();ov.style.display='none';render()}start.onclick=fresh;new.onclick=fresh;undo.onclick=()=>{if(hist){b=hist.b;score=hist.s;hist=null;render()}};document.querySelectorAll('[data-d]').forEach(k=>k.onclick=()=>move(k.dataset.d));onkeydown=e=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();move(m)}};board.addEventListener('touchstart',e=>{let q=e.touches[0];touch={x:q.clientX,y:q.clientY}},{passive:true});board.addEventListener('touchend',e=>{if(!touch)return;let q=e.changedTouches[0],dx=q.clientX-touch.x,dy=q.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});render()})()</script></body></html>

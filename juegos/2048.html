<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · Mini Arcade</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="theme-color" content="#14121f">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/companion.css">
<style>
  #app{width:min(94vw,390px);margin:auto}
  .score-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0 7px}
  .score-box{border:1px solid var(--grid);background:var(--panel);padding:8px 10px;color:var(--dim);font-size:7px}
  .score-box b{display:block;color:var(--ink);font-size:11px;margin-top:5px}
  .action-row{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
  .btn{font:7px inherit;color:var(--dim);background:var(--panel);border:1px solid var(--grid);padding:8px 9px;min-height:34px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .btn:hover{color:var(--ink);border-color:var(--dim)}
  .btn:active{transform:translate(1px,1px)}
  .intro{font-size:7px;color:var(--dim);line-height:1.9;margin:5px 0 10px;text-align:center}
  .board-wrap{position:relative}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;background:#252239;border:2px solid var(--grid);aspect-ratio:1;box-shadow:4px 4px 0 rgba(0,0,0,.28);touch-action:none;user-select:none;-webkit-user-select:none}
  .cell{display:flex;align-items:center;justify-content:center;background:#1c1a2a;border:1px solid rgba(139,132,171,.10);border-radius:2px;min-width:0;min-height:0}
  .tile{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:2px;font-size:clamp(14px,5.3vw,23px);font-weight:bold;letter-spacing:-.6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .tile.new{animation:tile-in .18s ease-out}
  .tile.merge{animation:tile-merge .18s ease-out}
  /* Paleta deliberadamente más apagada que la del resto del sitio: reduce el contraste sostenido sin perder la identidad del arcade. */
  .n2{background:#72b7b5;color:#151422}
  .n4{background:#d2b15c;color:#171521}
  .n8{background:#c76e7c;color:#f7edf4}
  .n16{background:#8876c4;color:#f7f3ff}
  .n32{background:#9f74a6;color:#fff7ff}
  .n64{background:#a96f5c;color:#fff7f1}
  .n128{background:#b79d5c;color:#171521}
  .n256{background:#5e9e9d;color:#f6ffff}
  .n512{background:#7569a8;color:#faf7ff}
  .n1024{background:#ad6777;color:#fff4f7}
  .n2048{background:#d5d0c1;color:#171521;box-shadow:inset 0 0 0 2px #c2aa61}
  .n4096{background:#bfc7d7;color:#171521;box-shadow:inset 0 0 0 2px #8d9ab5}
  .msg{text-align:center;min-height:18px;color:var(--c3);font-size:7px;margin:8px 0 4px}
  .keys{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:42px 42px;gap:5px;justify-content:center;margin-top:2px}
  .key{font:14px inherit;color:var(--ink);background:var(--panel);border:1px solid var(--grid);padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .key:active{transform:translate(1px,1px)}
  .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
  .overlay{position:absolute;inset:2px;background:rgba(20,18,31,.94);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}
  .overlay>div{max-width:300px}
  .overlay h2{font-size:13px;color:var(--c3);margin:0 0 9px}
  .overlay p{font-size:7px;color:var(--dim);line-height:1.9;margin:0 0 12px}
  .start{font:8px inherit;background:#72b7b5;color:var(--bg);border:0;padding:12px 18px;box-shadow:3px 3px 0 rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}
  .start:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.35)}
  .note{font-size:7px;color:var(--dim);line-height:1.8;text-align:center;margin-top:9px}
  @keyframes tile-in{0%{transform:scale(.82);opacity:.5}100%{transform:scale(1);opacity:1}}
  @keyframes tile-merge{0%{transform:scale(.9)}55%{transform:scale(1.045)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.tile.new,.tile.merge{animation:none}}
</style>
</head>
<body>
<div class="top-nav"><a class="back-link" href="../index.html">← MENÚ</a><span class="page-title">2048</span></div>
<main id="app">
  <div class="score-row">
    <div class="score-box">PUNTOS<b id="score">0</b></div>
    <div class="score-box">MEJOR<b id="best">0</b></div>
  </div>
  <div class="action-row">
    <button class="btn" id="undo" type="button">DESHACER</button>
    <button class="btn" id="new" type="button">NUEVO</button>
  </div>
  <p class="intro">Desliza o usa las flechas. Las fichas iguales se combinan. Llega a <b>2048</b> y continúa si quieres.</p>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="Tablero 2048"></div>
    <div class="overlay" id="overlay">
      <div>
        <h2>2048</h2>
        <p>Una ficha cada vez. Combina sin prisa y deja espacio para seguir construyendo.</p>
        <button class="start" id="start" type="button">EMPEZAR</button>
      </div>
    </div>
  </div>

  <div class="msg" id="msg"></div>
  <div class="keys" aria-label="Controles">
    <button class="key up" data-d="up" type="button">↑</button>
    <button class="key left" data-d="left" type="button">←</button>
    <button class="key down" data-d="down" type="button">↓</button>
    <button class="key right" data-d="right" type="button">→</button>
  </div>
  <p class="note">swipe · flechas · botones · récord de sesión</p>
</main>

<script>
(() => {
  'use strict';
  const N = 4;
  const BEST_KEY = 'miniArcade.2048.best';
  const boardEl = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');
  const newBtn = document.getElementById('new');
  const undoBtn = document.getElementById('undo');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');

  let board = Array.from({length:N}, () => Array(N).fill(0));
  let score = 0;
  let best = loadBest();
  let history = null;
  let started = false;
  let won = false;
  let touchStart = null;
  let pendingFx = null;

  function loadBest(){
    try { return Number(sessionStorage.getItem(BEST_KEY) || 0) || 0; }
    catch(e){ return 0; }
  }

  function saveBest(){
    try { sessionStorage.setItem(BEST_KEY, String(best)); }
    catch(e) {}
  }

  function emptyCells(){
    const out=[];
    for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!board[r][c]) out.push([r,c]);
    return out;
  }

  function addRandom(){
    const cells=emptyCells();
    if(!cells.length) return;
    const [r,c]=cells[Math.floor(Math.random()*cells.length)];
    board[r][c]=Math.random()<0.9 ? 2 : 4;
  }

  function canMove(){
    if(emptyCells().length) return true;
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(c<N-1 && board[r][c]===board[r][c+1]) return true;
      if(r<N-1 && board[r][c]===board[r+1][c]) return true;
    }
    return false;
  }

  function mergeLine(line){
    const compact=line.filter(Boolean);
    const out=[];
    let gained=0;
    for(let i=0;i<compact.length;i++){
      if(compact[i]===compact[i+1]){
        const value=compact[i]*2;
        out.push(value); gained+=value; i++;
      }else out.push(compact[i]);
    }
    while(out.length<N) out.push(0);
    return {out,gained};
  }

  function clone(){ return board.map(row => row.slice()); }
  function same(a,b){ return JSON.stringify(a)===JSON.stringify(b); }

  function move(direction){
    if(!started) return;
    const before=clone();
    const oldScore=score;
    const next=Array.from({length:N},()=>Array(N).fill(0));
    let gained=0;

    if(direction==='left'){
      for(let r=0;r<N;r++){const m=mergeLine(board[r]);next[r]=m.out;gained+=m.gained;}
    } else if(direction==='right'){
      for(let r=0;r<N;r++){const m=mergeLine(board[r].slice().reverse());next[r]=m.out.reverse();gained+=m.gained;}
    } else {
      for(let c=0;c<N;c++){
        const line=[];
        for(let r=0;r<N;r++) line.push(board[direction==='up'?r:N-1-r][c]);
        const m=mergeLine(line); gained+=m.gained;
        for(let r=0;r<N;r++) next[direction==='up'?r:N-1-r][c]=m.out[r];
      }
    }

    if(same(next,board)) return;

    history={board:before,score:oldScore};
    board=next;
    score+=gained;
    addRandom();
    if(score>best){best=score;saveBest();}
    if(!won && board.some(row=>row.includes(2048))){won=true;msgEl.textContent='🎉 2048 · puedes continuar';}
    else msgEl.textContent='';
    pendingFx={kind:gained?'merge':'new'};
    render();
    if(!canMove()) msgEl.textContent='SIN MOVIMIENTOS · FIN';
  }

  function fresh(){
    board=Array.from({length:N},()=>Array(N).fill(0));
    score=0; history=null; won=false; started=true; msgEl.textContent='';
    addRandom(); addRandom();
    overlay.style.display='none';
    pendingFx={kind:'new'};
    render();
  }

  function undo(){
    if(!started || !history) return;
    board=history.board; score=history.score; history=null;
    msgEl.textContent='MOVIMIENTO DESHECHO';
    pendingFx=null;
    render();
  }

  function render(){
    boardEl.innerHTML='';
    let fxUsed=false;
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      const value=board[r][c];
      if(value){
        const tile=document.createElement('div');
        tile.className='tile n'+value;
        tile.textContent=String(value);
        if(pendingFx && !fxUsed){ tile.classList.add(pendingFx.kind==='merge'?'merge':'new'); fxUsed=true; }
        cell.appendChild(tile);
      }
      boardEl.appendChild(cell);
    }
    pendingFx=null;
    scoreEl.textContent=String(score);
    bestEl.textContent=String(best);
  }

  startBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); fresh(); });
  newBtn.addEventListener('click', e => { e.preventDefault(); fresh(); });
  undoBtn.addEventListener('click', e => { e.preventDefault(); undo(); });

  document.querySelectorAll('[data-d]').forEach(button => {
    button.addEventListener('click', () => move(button.dataset.d));
  });

  window.addEventListener('keydown', e => {
    const direction={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
    if(direction){e.preventDefault();move(direction);}
  });

  boardEl.addEventListener('touchstart', e => {
    const t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY};
  }, {passive:true});

  boardEl.addEventListener('touchend', e => {
    if(!touchStart) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-touchStart.x;
    const dy=t.clientY-touchStart.y;
    touchStart=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
    move(Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
  }, {passive:true});

  render();
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
}
</script>
</body>
</html>

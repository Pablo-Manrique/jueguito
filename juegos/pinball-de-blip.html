<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinball de BLIP · Mini Arcade</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../assets/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Arcade">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/companion.css">
<style>
  #game-root{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }

  #hud{
    width:100%;
    max-width:440px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-size:clamp(8px, 2.6vw, 10px);
    letter-spacing:.5px;
    gap:6px 10px;
    flex-wrap:wrap;
  }
  #hud .stat{ color:var(--dim); }
  #hud .val{ color:var(--ink); margin-left:4px; }
  #hud .val.pop{ animation: pop-scale .45s ease; }
  #combo-mult{ display:inline-block; color:var(--c3); }
  #combo-mult.pop{ animation: pop-scale .45s ease; }

  #hud2{
    width:100%;
    max-width:440px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-bottom:8px;
  }
  .mini-btn{
    font-family:inherit;
    font-size:clamp(9px, 2.6vw, 10px);
    background:transparent;
    color:var(--dim);
    border:1px solid var(--grid);
    padding:9px 12px;
    min-height:36px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .mini-btn:hover{ color:var(--ink); border-color:var(--dim); }
  .mini-btn:active{ transform:translate(1px,1px); }

  #canvas-wrap{
    position:relative;
    width:100%;
    max-width:440px;
    border:3px solid var(--grid);
    background:var(--panel);
    box-shadow: 0 0 0 4px var(--bg), 6px 6px 0 rgba(0,0,0,.35);
    overflow:hidden;
  }
  canvas{
    display:block;
    width:100%;
    aspect-ratio: 5 / 8;
    touch-action:none;
  }
  #ball-slot{
    position:absolute;
    top:0; left:0;
    z-index:4;
    pointer-events:none;
  }

  #flash-overlay{
    position:absolute; inset:0;
    opacity:0;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  #flash-overlay.flash{ animation: flash-fade .3s ease-out; }

  #banner{
    position:absolute;
    top:10px; left:50%;
    transform:translate(-50%,-10px);
    font-size:10px;
    color:var(--ink);
    background:rgba(20,18,31,.85);
    border:1px solid var(--grid);
    padding:6px 10px;
    opacity:0;
    pointer-events:none;
    white-space:nowrap;
    z-index:3;
  }
  #banner.show{ animation: banner-in 1.1s ease; }

  #overlay{
    position:absolute; inset:0;
    background:rgba(20,18,31,.92);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:12px; text-align:center; padding:18px;
    z-index:5;
  }
  #overlay h2{ font-size:clamp(12px, 4vw, 14px); margin:0; color:var(--c3); }
  #overlay.lost h2{ color:var(--c1); }
  #overlay p{ font-size:clamp(8px, 2.6vw, 9px); color:var(--dim); line-height:1.9; margin:0; max-width:330px; }
  #overlay-score{ display:none; font-size:clamp(9px,2.8vw,11px); color:var(--ink); }
  #overlay button{
    font-family:inherit; font-size:clamp(10px, 3vw, 11px);
    background:var(--c2); color:#14121f;
    border:none; padding:13px 20px; cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.4);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #overlay button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.4); }

  #controls-row{
    width:100%;
    max-width:440px;
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .flip-btn{
    flex:1;
    height:clamp(68px, 20vw, 96px);
    background:var(--panel);
    border:2px solid var(--grid);
    color:var(--ink);
    font-size:clamp(10px, 3vw, 12px);
    font-family:inherit;
    letter-spacing:1px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    box-shadow:3px 3px 0 rgba(0,0,0,.3);
  }
  .flip-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.3); background:var(--c4); color:#14121f; }

  #foot-note{ margin-top:10px; font-size:clamp(7px, 2vw, 8px); color:var(--dim); text-align:center; max-width:480px; line-height:1.8; }

  @keyframes pop-scale{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.6) rotate(-8deg); }
    70%{ transform:scale(.9); }
    100%{ transform:scale(1); }
  }
  @keyframes flash-fade{
    0%{ opacity:.3; }
    100%{ opacity:0; }
  }
  @keyframes banner-in{
    0%{ opacity:0; transform:translate(-50%,-10px); }
    15%{ opacity:1; transform:translate(-50%,0); }
    82%{ opacity:1; transform:translate(-50%,0); }
    100%{ opacity:0; transform:translate(-50%,-10px); }
  }
</style>
</head>
<body>

  <div class="top-nav">
    <a class="back-link" href="../index.html">← MENÚ</a>
    <span class="page-title">PINBALL DE BLIP</span>
  </div>

  <div id="game-root">
    <div id="hud">
      <div><span class="stat">PUNTOS</span><span class="val" id="score-val">0</span></div>
      <div><span class="stat">COMBO</span><span class="val" id="combo-val">0</span><span class="val" id="combo-mult"></span></div>
      <div><span class="stat">BOLAS</span><span class="val" id="balls-val">3</span></div>
      <div><span class="stat">MEJOR</span><span class="val" id="best-val">0</span></div>
    </div>

    <div id="hud2">
      <button class="mini-btn" id="mute-btn">SONIDO: ON</button>
      <button class="mini-btn" id="restart-btn">REINICIAR</button>
    </div>

    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
      <div id="ball-slot"></div>
      <div id="flash-overlay"></div>
      <div id="banner">¡COMBO!</div>
      <div id="overlay">
        <h2 id="overlay-title">PINBALL DE BLIP</h2>
        <p id="overlay-text">BLIP es la bola. Usa los flippers para no dejarlo caer y golpea los topes para sumar puntos y combo. Tienes 3 bolas — cuando se acaban, se termina.</p>
        <div id="overlay-score"></div>
        <button id="start-btn">EMPEZAR</button>
      </div>
    </div>

    <div id="controls-row">
      <button class="flip-btn" id="btn-left" aria-label="Flipper izquierdo">◤ FLIPPER</button>
      <button class="flip-btn" id="btn-right" aria-label="Flipper derecho">FLIPPER ◥</button>
    </div>

    <div id="foot-note">sin guardado de partida &middot; botones físicos, o flechas del teclado</div>
  </div>

<script>
(function(){
  const root = document.documentElement;
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  const ballSlot = document.getElementById('ball-slot');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const overlayScore = document.getElementById('overlay-score');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const muteBtn = document.getElementById('mute-btn');
  const scoreEl = document.getElementById('score-val');
  const comboEl = document.getElementById('combo-val');
  const comboMultEl = document.getElementById('combo-mult');
  const ballsEl = document.getElementById('balls-val');
  const bestEl = document.getElementById('best-val');
  const flashOverlay = document.getElementById('flash-overlay');
  const banner = document.getElementById('banner');
  const btnLeft = document.getElementById('btn-left');
  const btnRight = document.getElementById('btn-right');

  function getVar(name){ return getComputedStyle(root).getPropertyValue(name).trim(); }
  const BUMPER_COLORS = [getVar('--c1'), getVar('--c2'), getVar('--c3')];

  const BEST_KEY = 'miniArcade.pinball.best';
  function loadBest(){
    try{ const v = sessionStorage.getItem(BEST_KEY); return v ? (parseInt(v,10)||0) : 0; }
    catch(e){ return 0; }
  }
  function saveBest(v){
    try{ sessionStorage.setItem(BEST_KEY, String(v)); } catch(e){}
  }

  let W=0, H=0;
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
  function setupCanvas(){
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W*dpr);
    canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  setupCanvas();
  const REF_H = 700;
  function scaleF(){ return H / REF_H; }

  let ball = null;
  let bumpers = [];
  let leftFlipper = null;
  let rightFlipper = null;
  let ballRotation = 0;

  let score = 0, combo = 0, lastMult = 1, balls = 3;
  let sessionBest = loadBest();
  let running = false;
  let rafId = null;
  let lastTime = null;
  let muted = false;
  let audioCtx = null;
  let leftActive = false, rightActive = false;

  function rnd(a,b){ return a + Math.random()*(b-a); }

  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
  }
  function beep(freq, dur, type, vol, glideTo){
    if(muted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.06;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, now + dur);
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.start(now);
    osc.stop(now + dur);
  }
  function sfxBumper(){ beep(rnd(500,700), 0.06, 'square', 0.05); }
  function sfxFlipper(){ beep(220, 0.04, 'square', 0.035); }
  function sfxWall(){ beep(300, 0.02, 'sine', 0.02); }
  function sfxDrain(){ beep(180, 0.22, 'sawtooth', 0.055, 55); }
  function sfxMult(){ beep(900,0.07,'square',0.05); setTimeout(()=>beep(1200,0.09,'square',0.05),60); }
  function sfxGameOver(){ beep(260, 0.3, 'sawtooth', 0.06, 60); }

  function replay(el, cls){
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }
  function flashColor(hex){
    flashOverlay.style.background = hex;
    replay(flashOverlay, 'flash');
  }

  function multiplierFor(c){
    if(c >= 20) return 3;
    if(c >= 10) return 2;
    if(c >= 5) return 1.5;
    return 1;
  }

  function updateHUD(){
    scoreEl.textContent = score;
    comboEl.textContent = combo;
    ballsEl.textContent = balls;
    const m = multiplierFor(combo);
    comboMultEl.textContent = m > 1 ? ' x' + m : '';
    if(score > sessionBest){
      sessionBest = score;
      saveBest(sessionBest);
      replay(bestEl, 'pop');
    }
    bestEl.textContent = sessionBest;
  }

  function buildTable(){
    const s = scaleF();
    bumpers = [
      { x:W*0.5,  y:H*0.32, r:18*s, color:BUMPER_COLORS[0], hit:0 },
      { x:W*0.28, y:H*0.46, r:15*s, color:BUMPER_COLORS[1], hit:0 },
      { x:W*0.72, y:H*0.46, r:15*s, color:BUMPER_COLORS[2], hit:0 }
    ];
    const pivotY = H*0.85;
    const len = W*0.2;
    leftFlipper = {
      pivotX: W*0.32, pivotY,
      len,
      restAngle: 70*Math.PI/180,
      activeAngle: -40*Math.PI/180,
      angle: 70*Math.PI/180,
      side: 1
    };
    rightFlipper = {
      pivotX: W*0.68, pivotY,
      len,
      restAngle: 110*Math.PI/180,
      activeAngle: 220*Math.PI/180,
      angle: 110*Math.PI/180,
      side: -1
    };
  }

  function newBall(){
    const s = scaleF();
    ball = {
      x: W*0.5 + rnd(-10,10)*s,
      y: H*0.14,
      r: 8*s,
      vx: rnd(-30,30)*s,
      vy: 0
    };
  }

  function flipperTip(f){
    return { x: f.pivotX + Math.cos(f.angle)*f.len, y: f.pivotY + Math.sin(f.angle)*f.len };
  }

  function closestPointOnSegment(px,py, ax,ay, bx,by){
    const dx = bx-ax, dy = by-ay;
    const lenSq = dx*dx+dy*dy;
    let t = lenSq>0 ? ((px-ax)*dx + (py-ay)*dy) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    return { x: ax+dx*t, y: ay+dy*t };
  }

  function handleFlipperCollision(f, active){
    const tip = flipperTip(f);
    const cp = closestPointOnSegment(ball.x, ball.y, f.pivotX, f.pivotY, tip.x, tip.y);
    const dx = ball.x-cp.x, dy = ball.y-cp.y;
    const dist = Math.hypot(dx,dy);
    const thickness = 7*scaleF();
    if(dist < ball.r+thickness){
      const nx = dist>0.01 ? dx/dist : 0, ny = dist>0.01 ? dy/dist : -1;
      ball.x = cp.x + nx*(ball.r+thickness);
      ball.y = cp.y + ny*(ball.r+thickness);
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = nx*speed*0.6;
      ball.vy = ny*speed*0.6;
      if(active){
        const s = scaleF();
        ball.vy -= 260*s;
        ball.vx += f.side * 110*s;
      }
      sfxFlipper();
      return true;
    }
    return false;
  }

  function registerHit(){
    combo++;
    const mult = multiplierFor(combo);
    score += Math.round(100*mult);
    if(mult > lastMult){
      replay(comboMultEl, 'pop');
      banner.textContent = '¡COMBO x' + mult + '!';
      banner.style.color = getVar('--c3');
      replay(banner, 'show');
      sfxMult();
      if(window.Companion) Companion.play('cheer');
    }
    lastMult = mult;
    updateHUD();
  }

  function drawFlipper(f){
    const tip = flipperTip(f);
    ctx.strokeStyle = getVar('--c4');
    ctx.lineWidth = 9*scaleF();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(f.pivotX, f.pivotY);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = getVar('--panel');
    ctx.fillRect(0,0,W,H);

    bumpers.forEach(b=>{
      const glow = b.hit>0;
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r + (glow?3:0),0,Math.PI*2);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = glow ? 1 : 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    if(leftFlipper) drawFlipper(leftFlipper);
    if(rightFlipper) drawFlipper(rightFlipper);
  }

  function updateBallVisual(){
    if(!ball) return;
    ballSlot.style.transform = 'translate(' + (ball.x-15) + 'px,' + (ball.y-16) + 'px) rotate(' + ballRotation + 'rad)';
  }

  function loseBall(){
    balls--;
    updateHUD();
    if(balls <= 0){
      triggerGameOver();
      return;
    }
    sfxDrain();
    flashColor(getVar('--c1'));
    if(window.Companion) Companion.play('sad');
    combo = 0; lastMult = 1;
    updateHUD();
    newBall();
  }

  function loop(ts){
    if(!running) return;
    if(lastTime === null) lastTime = ts;
    const dt = Math.min((ts-lastTime)/1000, 0.026);
    lastTime = ts;
    const s = scaleF();

    const targetL = leftActive ? leftFlipper.activeAngle : leftFlipper.restAngle;
    leftFlipper.angle += (targetL - leftFlipper.angle) * Math.min(1, dt*16);
    const targetR = rightActive ? rightFlipper.activeAngle : rightFlipper.restAngle;
    rightFlipper.angle += (targetR - rightFlipper.angle) * Math.min(1, dt*16);

    if(ball){
      ball.vy += 620*s*dt;
      ball.x += ball.vx*dt;
      ball.y += ball.vy*dt;

      if(ball.x - ball.r < 0){ ball.x = ball.r; ball.vx *= -0.9; sfxWall(); }
      if(ball.x + ball.r > W){ ball.x = W-ball.r; ball.vx *= -0.9; sfxWall(); }
      if(ball.y - ball.r < 0){ ball.y = ball.r; ball.vy *= -0.9; sfxWall(); }

      bumpers.forEach(b=>{
        if(b.hit>0) b.hit -= dt;
        const dx = ball.x-b.x, dy = ball.y-b.y;
        const dist = Math.hypot(dx,dy);
        if(dist < ball.r+b.r){
          const nx = dist>0.01 ? dx/dist : 0, ny = dist>0.01 ? dy/dist : -1;
          ball.x = b.x + nx*(ball.r+b.r+1);
          ball.y = b.y + ny*(ball.r+b.r+1);
          const kick = 300*s;
          ball.vx = nx*kick;
          ball.vy = ny*kick;
          b.hit = 0.15;
          sfxBumper();
          registerHit();
        }
      });

      handleFlipperCollision(leftFlipper, leftActive);
      handleFlipperCollision(rightFlipper, rightActive);

      const maxSpeed = 560*s;
      const spd = Math.hypot(ball.vx, ball.vy);
      if(spd > maxSpeed){
        ball.vx = ball.vx/spd*maxSpeed;
        ball.vy = ball.vy/spd*maxSpeed;
      }

      ballRotation += ball.vx*dt*0.05;
      updateBallVisual();

      if(ball.y - ball.r > H + 10){
        ball = null;
        loseBall();
      }
    }

    draw();
    rafId = requestAnimationFrame(loop);
  }

  function resetGame(){
    score = 0; combo = 0; lastMult = 1; balls = 3;
    setupCanvas();
    buildTable();
    newBall();
    lastTime = null;
    leftActive = false; rightActive = false;
    overlay.classList.remove('lost');
    overlayTitle.textContent = 'PINBALL DE BLIP';
    overlayText.textContent = 'BLIP es la bola. Usa los flippers para no dejarlo caer y golpea los topes para sumar puntos y combo. Tienes 3 bolas — cuando se acaban, se termina.';
    overlayScore.style.display = 'none';
    startBtn.textContent = 'EMPEZAR';
    updateHUD();
    updateBallVisual();
    draw();
  }

  function triggerGameOver(){
    running = false;
    overlay.classList.add('lost');
    overlayTitle.textContent = 'SIN BOLAS';
    overlayText.textContent = 'Se te escaparon las 3 bolas.';
    overlayScore.style.display = 'block';
    overlayScore.textContent = 'PUNTOS: ' + score + '   ·   MEJOR: ' + sessionBest;
    startBtn.textContent = 'REINTENTAR';
    overlay.style.display = 'flex';
    sfxGameOver();
    flashColor(getVar('--c1'));
    if(window.Companion) Companion.play('sad');
  }

  function startGame(){
    ensureAudio();
    resetGame();
    overlay.style.display = 'none';
    running = true;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  let resizeQueued = false;
  window.addEventListener('resize', ()=>{
    if(resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(()=>{
      resizeQueued = false;
      setupCanvas();
      buildTable();
      draw();
    });
  });

  btnLeft.addEventListener('pointerdown', e=>{ e.preventDefault(); leftActive = true; });
  btnLeft.addEventListener('pointerup', ()=>leftActive=false);
  btnLeft.addEventListener('pointerleave', ()=>leftActive=false);
  btnLeft.addEventListener('pointercancel', ()=>leftActive=false);

  btnRight.addEventListener('pointerdown', e=>{ e.preventDefault(); rightActive = true; });
  btnRight.addEventListener('pointerup', ()=>rightActive=false);
  btnRight.addEventListener('pointerleave', ()=>rightActive=false);
  btnRight.addEventListener('pointercancel', ()=>rightActive=false);

  window.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowLeft' || e.key==='ArrowRight') e.preventDefault();
    if(e.key==='ArrowLeft') leftActive = true;
    else if(e.key==='ArrowRight') rightActive = true;
  });
  window.addEventListener('keyup', (e)=>{
    if(e.key==='ArrowLeft') leftActive = false;
    else if(e.key==='ArrowRight') rightActive = false;
  });

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  muteBtn.addEventListener('click', ()=>{
    muted = !muted;
    muteBtn.textContent = 'SONIDO: ' + (muted ? 'OFF' : 'ON');
  });

  buildTable();
  bestEl.textContent = sessionBest;
  draw();
})();
</script>

<script src="../assets/companion.js"></script>
<script>
  Companion.mount(document.getElementById('ball-slot'), { size: 30 });
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('../sw.js').catch(()=>{});
    });
  }
</script>

</body>
</html>

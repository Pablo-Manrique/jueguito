<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLIP · Mini Arcade</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/favicon-48.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Arcade">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/companion.css">
<style>
  .blip-intro{
    width:100%;
    max-width:480px;
    text-align:center;
    margin-bottom:16px;
  }
  .blip-intro h1{
    font-size:clamp(14px, 4.5vw, 18px);
    color:var(--c3);
    margin:0 0 10px;
  }
  .blip-intro p{
    font-size:clamp(8px, 2.4vw, 9px);
    color:var(--dim);
    line-height:1.9;
    margin:0;
  }
</style>
</head>
<body>

  <div class="top-nav">
    <a class="back-link" href="index.html">← MENÚ</a>
    <span class="page-title">BLIP</span>
  </div>

  <div class="blip-intro">
    <h1>ESTE ES BLIP</h1>
    <p>Vive contigo en cada juego del arcade y celebra cuando te sale bien una jugada. Aquí puedes verlo de cerca y probar todos sus gestos.</p>
  </div>

  <div class="blip-stage" id="blip-stage"></div>

  <div class="blip-gestures">
    <button data-gesture="wave">SALUDAR</button>
    <button data-gesture="cheer">CELEBRAR</button>
    <button data-gesture="think">PENSAR</button>
    <button data-gesture="surprise">SORPRESA</button>
    <button data-gesture="sad">TRISTE</button>
    <button data-gesture="sleep">DORMIR</button>
  </div>

<script src="assets/companion.js"></script>
<script>
  const stage = document.getElementById('blip-stage');
  Companion.mount(stage, { size: 120, autoGesture: 'wave', autoGestureDelay: 400 });

  document.querySelectorAll('.blip-gestures button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      Companion.play(btn.dataset.gesture);
    });
  });
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>

</body>
</html>
